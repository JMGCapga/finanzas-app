<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finanzas Cruzadas — cruces y saldos</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script>
window.storage = {
  get: async (k) => { const v = localStorage.getItem(k); return v == null ? null : { value: v }; },
  set: async (k, v) => { localStorage.setItem(k, v); return true; }
};
</script>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"><style>body{margin:0}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ─── Diseño: "vale de obra" ─ concreto + azul plano ───
const T = {
  bg: "#ECEDEA",
  card: "#FFFFFF",
  ink: "#20241F",
  gris: "#6B7066",
  linea: "#D5D7D0",
  azul: "#1F3A5F",
  azulSuave: "#E4EAF2",
  alerta: "#B5451B",
  ok: "#3A6B4A",
};

const ENTIDADES_INICIALES = [
  { id: "personal", nombre: "Personal (JM)", tipo: "mio" },
  { id: "capga", nombre: "Capga Workshop", tipo: "mio" },
  { id: "troncoso", nombre: "Materiales Troncoso", tipo: "mio" },
  { id: "cemcoyaa", nombre: "Abastecedora Cemcoyaa", tipo: "mio" },
  { id: "itzayana", nombre: "Itzayana", tipo: "mio" },
  { id: "hermano", nombre: "Hermano", tipo: "otro", categoria: "familiar" },
  { id: "primo", nombre: "Primo", tipo: "otro", categoria: "cliente" },
  { id: "papa", nombre: "Papá", tipo: "otro", categoria: "familiar" },
];

const CATEGORIAS = [["cliente", "Cliente"], ["familiar", "Familiar"], ["prestamo", "Préstamo"], ["deuda", "Deuda"]];
const categoriaDe = (e) => (CATEGORIAS.find((c) => c[0] === (e || {}).categoria) || [])[1] || "";

const CUENTAS_INICIALES = [
  { id: "c1", entidad: "personal", nombre: "Tarjeta personal" },
  { id: "c2", entidad: "personal", nombre: "Efectivo JM" },
  { id: "c3", entidad: "capga", nombre: "Tarjeta Capga" },
  { id: "c4", entidad: "troncoso", nombre: "Cuenta Troncoso" },
  { id: "c5", entidad: "papa", nombre: "Tarjeta de papá" },
  { id: "c6", entidad: "cemcoyaa", nombre: "Terminal Cemcoyaa BBVA" },
  { id: "c7", entidad: "itzayana", nombre: "Terminal Itzayana Mercado Pago" },
  { id: "c8", entidad: "itzayana", nombre: "Terminal Itzayana BBVA" },
];

const fmt = (n) =>
  "$" + Number(n || 0).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const hoy = () => new Date().toISOString().slice(0, 10);

const normMat = (t) => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();

const fmtS = (n) => (n < 0 ? "−" : "") + fmt(Math.abs(n));

const fechaMX = (f) => (f ? String(f).split("-").reverse().join("/") : "");

const envolver = (ctx, texto, ancho, maxLineas) => {
  const palabras = String(texto).split(/\s+/);
  const lineas = [];
  let actual = "";
  palabras.forEach((p) => {
    const prueba = actual ? actual + " " + p : p;
    if (!actual || ctx.measureText(prueba).width <= ancho) actual = prueba;
    else { lineas.push(actual); actual = p; }
  });
  if (actual) lineas.push(actual);
  if (lineas.length <= maxLineas) return lineas;
  const corte = lineas.slice(0, maxLineas);
  let u = corte[maxLineas - 1];
  while (u.length > 1 && ctx.measureText(u + "…").width > ancho) u = u.slice(0, -1);
  corte[maxLineas - 1] = u + "…";
  return corte;
};

const textoEstado = (nombre, filas, saldo, multi, nombreDe) => {
  const l = ["*ESTADO DE CUENTA — " + nombre + "*", "Al " + fechaMX(hoy()), ""];
  filas.forEach((f) => {
    l.push(
      fechaMX(f.m.fecha) + " · " + f.m.desc + (multi ? " · con " + nombreDe(f.otro) : "") + " · " +
        (f.delta > 0 ? "cargo " : "abono ") + fmt(Math.abs(f.delta)) + " · saldo " + fmtS(f.saldo)
    );
  });
  l.push("");
  l.push(saldo > 0 ? "*Saldo a pagar: " + fmt(saldo) + "*" : saldo < 0 ? "*Saldo a favor de " + nombre + ": " + fmt(-saldo) + "*" : "*Sin saldo pendiente*");
  return l.join("\n");
};

const dibujarEstado = (nombre, etiqueta, filas, saldo, multi, nombreDe) => {
  const W = 900;
  const pad = 40;
  const esc = 2;
  const medir = document.createElement("canvas").getContext("2d");
  medir.font = "13px Arial";
  const dib = filas.map((f) => {
    const lineas = envolver(medir, f.m.desc + (multi ? " · con " + nombreDe(f.otro) : ""), 410, 3);
    return { f, lineas, alto: Math.max(40, lineas.length * 17 + 14) };
  });
  const altoTabla = Math.max(dib.reduce((s, r) => s + r.alto, 0), 40);
  const alto = 220 + altoTabla + 130;
  const canvas = document.createElement("canvas");
  canvas.width = W * esc;
  canvas.height = alto * esc;
  const ctx = canvas.getContext("2d");
  ctx.scale(esc, esc);
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, W, alto);
  ctx.fillStyle = T.azul;
  ctx.fillRect(0, 0, W, 90);
  ctx.fillStyle = "#FFFFFF";
  ctx.font = "bold 28px Arial";
  ctx.textAlign = "left";
  ctx.fillText("ESTADO DE CUENTA", pad, 56);
  ctx.fillStyle = T.ink;
  ctx.font = "bold 22px Arial";
  ctx.fillText(nombre, pad, 135);
  ctx.fillStyle = T.gris;
  ctx.font = "14px Arial";
  ctx.fillText((etiqueta ? etiqueta + " · " : "") + "al " + fechaMX(hoy()), pad, 160);
  const yT = 190;
  ctx.fillStyle = T.azulSuave;
  ctx.fillRect(pad, yT, W - 2 * pad, 30);
  ctx.fillStyle = T.azul;
  ctx.font = "bold 12px Arial";
  ctx.fillText("FECHA", pad + 10, yT + 20);
  ctx.fillText("CONCEPTO", 150, yT + 20);
  ctx.textAlign = "right";
  ctx.fillText("CARGO", 650, yT + 20);
  ctx.fillText("ABONO", 755, yT + 20);
  ctx.fillText("SALDO", W - pad - 10, yT + 20);
  let y = yT + 30;
  if (dib.length === 0) {
    ctx.textAlign = "left";
    ctx.fillStyle = T.gris;
    ctx.font = "13px Arial";
    ctx.fillText("Sin movimientos.", pad + 10, y + 26);
    y += 40;
  }
  dib.forEach((r) => {
    ctx.textAlign = "left";
    ctx.fillStyle = T.gris;
    ctx.font = "12px Arial";
    ctx.fillText(fechaMX(r.f.m.fecha), pad + 10, y + 24);
    ctx.fillStyle = T.ink;
    ctx.font = "13px Arial";
    r.lineas.forEach((ln, i) => ctx.fillText(ln, 150, y + 24 + i * 17));
    ctx.textAlign = "right";
    if (r.f.delta > 0) {
      ctx.fillStyle = T.ink;
      ctx.fillText(fmt(r.f.delta), 650, y + 24);
    } else {
      ctx.fillStyle = T.ok;
      ctx.fillText(fmt(-r.f.delta), 755, y + 24);
    }
    ctx.fillStyle = T.ink;
    ctx.font = "bold 13px Arial";
    ctx.fillText(fmtS(r.f.saldo), W - pad - 10, y + 24);
    ctx.strokeStyle = T.linea;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad, y + r.alto);
    ctx.lineTo(W - pad, y + r.alto);
    ctx.stroke();
    y += r.alto;
  });
  y += 34;
  ctx.textAlign = "left";
  ctx.fillStyle = T.azul;
  ctx.font = "bold 20px Arial";
  ctx.fillText(saldo > 0 ? "SALDO A PAGAR" : saldo < 0 ? "SALDO A FAVOR DE " + nombre.toUpperCase() : "SIN SALDO PENDIENTE", pad, y);
  if (saldo !== 0) {
    ctx.textAlign = "right";
    ctx.fillText(fmt(Math.abs(saldo)), W - pad, y);
  }
  ctx.textAlign = "left";
  ctx.fillStyle = T.gris;
  ctx.font = "12px Arial";
  ctx.fillText("Generado el " + fechaMX(hoy()), pad, y + 36);
  return canvas;
};

function FinanzasCruzadas() {
  const [entidades, setEntidades] = useState(ENTIDADES_INICIALES);
  const [cuentas, setCuentas] = useState(CUENTAS_INICIALES);
  const [movs, setMovs] = useState([]);
  const [pendientes, setPendientes] = useState([]);
  const [nuevoPend, setNuevoPend] = useState({ desc: "", monto: "", fecha: hoy(), entidad: "troncoso" });
  const [porCobrar, setPorCobrar] = useState([]);
  const [nuevoCobro, setNuevoCobro] = useState({ desc: "", monto: "", fecha: hoy() });
  const [tab, setTab] = useState("registrar");
  const [cargando, setCargando] = useState(true);
  const [guardado, setGuardado] = useState(null);
  const [aviso, setAviso] = useState(null);
  const [pegado, setPegado] = useState("");
  const [nuevaCat, setNuevaCat] = useState("cliente");
  const [estadoId, setEstadoId] = useState(null);
  const [avisoEstado, setAvisoEstado] = useState(null);

  const [f, setF] = useState({
    fecha: hoy(),
    desc: "",
    monto: "",
    cant: "",
    unidad: "ton",
    pu: "",
    puAuto: "",
    material: "",
    prestamo: "",
    tipo: "gasto",
    cuentaPago: "c1",
    corresponde: "personal",
  });

  const [nuevaEnt, setNuevaEnt] = useState("");
  const [nuevaCta, setNuevaCta] = useState({ nombre: "", entidad: "personal" });

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get("finanzas-datos");
        if (r && r.value) {
          const d = JSON.parse(r.value);
          // fusiona lo guardado con las iniciales (lo guardado manda, pero nada se pierde)
          const entGuardadas = d.entidades && d.entidades.length ? d.entidades : [];
          const entFusion = [...entGuardadas];
          ENTIDADES_INICIALES.forEach((e) => {
            const ya = entFusion.find((x) => x.id === e.id);
            if (!ya) entFusion.push(e);
            else { ya.tipo = e.tipo; if (!ya.categoria && e.categoria) ya.categoria = e.categoria; } // sincroniza mía/externo con la versión actual
          });
          setEntidades(entFusion);
          const ctasGuardadas = d.cuentas && d.cuentas.length ? d.cuentas : [];
          const ctaFusion = [...ctasGuardadas];
          CUENTAS_INICIALES.forEach((c) => {
            if (!ctaFusion.find((x) => x.id === c.id || x.nombre === c.nombre)) ctaFusion.push(c);
          });
          setCuentas(ctaFusion);
          if (d.movs) setMovs(d.movs);
          if (d.pendientes) setPendientes(d.pendientes);
          if (d.porCobrar) setPorCobrar(d.porCobrar);
        }
      } catch (e) {
        /* primera vez */
      }
      setCargando(false);
    })();
  }, []);

  const persistir = async (data) => {
    try {
      await window.storage.set(
        "finanzas-datos",
        JSON.stringify({
          entidades: data.entidades || entidades,
          cuentas: data.cuentas || cuentas,
          movs: data.movs || movs,
          pendientes: data.pendientes || pendientes,
          porCobrar: data.porCobrar || porCobrar,
        })
      );
      setGuardado("Guardado ✓");
      setTimeout(() => setGuardado(null), 1500);
    } catch (e) {
      setGuardado("No se pudo guardar");
    }
  };

  // ─── Respaldo: exportar / importar (combina por id, nunca borra ni modifica lo existente) ───
  const exportarJSON = () => {
    const datos = { app: "finanzas-cruzadas", version: 1, exportado: new Date().toISOString(), entidades, cuentas, movs, pendientes, porCobrar };
    const blob = new Blob([JSON.stringify(datos, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "finanzas-cruzadas-" + hoy() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setAviso({ tipo: "ok", texto: "Respaldo descargado: " + movs.length + " movimientos, " + entidades.length + " personas/negocios, " + cuentas.length + " cuentas." });
  };

  const esTexto = (v) => typeof v === "string" && v.trim() !== "";
  const esMonto = (v) => typeof v === "number" && isFinite(v) && v > 0;
  const esFecha = (v) => typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v);
  const numONull = (v) => (typeof v === "number" && isFinite(v) ? v : null);

  const importarTexto = (texto) => {
    let d = null;
    try { d = JSON.parse(texto); } catch (e) { d = null; }
    const hayAlgo = d && typeof d === "object" && ["entidades", "cuentas", "movs", "pendientes", "porCobrar"].some((k) => Array.isArray(d[k]));
    if (!hayAlgo) {
      setAviso({ tipo: "error", texto: "Eso no es un respaldo válido de Finanzas Cruzadas. No se cambió nada." });
      return false;
    }
    const cuenta = { descartadas: 0 };
    const unir = (actual, nuevos, limpiar) => {
      const ids = new Set(actual.map((x) => x.id));
      const lista = [...actual];
      let agregados = 0;
      let existentes = 0;
      (Array.isArray(nuevos) ? nuevos : []).forEach((x) => {
        if (x && typeof x === "object" && esTexto(x.id) && ids.has(x.id)) { existentes++; return; }
        const y = x && typeof x === "object" ? limpiar(x) : null;
        if (!y) { cuenta.descartadas++; return; }
        ids.add(y.id);
        lista.push(y);
        agregados++;
      });
      return { lista, agregados, existentes };
    };
    const rEnt = unir(entidades, d.entidades, (x) =>
      esTexto(x.id) && esTexto(x.nombre) ? { id: x.id, nombre: x.nombre.trim(), tipo: x.tipo === "mio" ? "mio" : "otro", categoria: CATEGORIAS.some((c) => c[0] === x.categoria) ? x.categoria : undefined } : null);
    const idsEnt = new Set(rEnt.lista.map((x) => x.id));
    const rCta = unir(cuentas, d.cuentas, (x) =>
      esTexto(x.id) && esTexto(x.nombre) && idsEnt.has(x.entidad) ? { id: x.id, entidad: x.entidad, nombre: x.nombre.trim() } : null);
    const idsCta = new Set(rCta.lista.map((x) => x.id));
    const rMov = unir(movs, d.movs, (x) =>
      esTexto(x.id) && esFecha(x.fecha) && esMonto(x.monto) && esTexto(x.desc) &&
      ["gasto", "ingreso", "transferencia"].indexOf(x.tipo) >= 0 &&
      idsEnt.has(x.pagador) && idsEnt.has(x.corresponde) && idsCta.has(x.cuenta)
        ? { id: x.id, fecha: x.fecha, desc: x.desc, monto: x.monto, cant: numONull(x.cant), unidad: typeof x.unidad === "string" ? x.unidad : "ton", pu: numONull(x.pu), material: typeof x.material === "string" && x.material.trim() ? x.material.trim() : null, prestamo: typeof x.prestamo === "string" && idsEnt.has(x.prestamo) ? x.prestamo : null, tipo: x.tipo, pagador: x.pagador, cuenta: x.cuenta, corresponde: x.corresponde }
        : null);
    const rPen = unir(pendientes, d.pendientes, (x) =>
      esTexto(x.id) && esTexto(x.desc) && esMonto(x.monto) && esFecha(x.fecha) && idsEnt.has(x.entidad)
        ? { id: x.id, desc: x.desc, monto: x.monto, fecha: x.fecha, entidad: x.entidad }
        : null);
    const rCob = unir(porCobrar, d.porCobrar, (x) =>
      esTexto(x.id) && esTexto(x.desc) && esMonto(x.monto) && esFecha(x.fecha)
        ? { id: x.id, desc: x.desc, monto: x.monto, fecha: x.fecha }
        : null);
    const nuevos = rEnt.agregados + rCta.agregados + rMov.agregados + rPen.agregados + rCob.agregados;
    const yaEstaban = rMov.existentes + rPen.existentes + rCob.existentes;
    const nota = cuenta.descartadas > 0 ? " " + cuenta.descartadas + " filas se descartaron por formato inválido o por referirse a personas/cuentas que no existen." : "";
    if (nuevos === 0) {
      setAviso({ tipo: "ok", texto: "No había nada nuevo: todo ya estaba en esta app (" + yaEstaban + " registros repetidos)." + nota });
      return true;
    }
    const resumen = rMov.agregados + " movimientos, " + rPen.agregados + " pendientes, " + rCob.agregados + " por cobrar, " + rEnt.agregados + " personas/negocios y " + rCta.agregados + " cuentas nuevas";
    if (!window.confirm("Se agregarán " + resumen + ".\n" + yaEstaban + " registros ya estaban y no se tocan. Nada se borra ni se modifica.\n\n¿Continuar?")) return false;
    const movsNuevos = rMov.lista.slice().sort((a, b) => (a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0));
    setEntidades(rEnt.lista);
    setCuentas(rCta.lista);
    setMovs(movsNuevos);
    setPendientes(rPen.lista);
    setPorCobrar(rCob.lista);
    persistir({ entidades: rEnt.lista, cuentas: rCta.lista, movs: movsNuevos, pendientes: rPen.lista, porCobrar: rCob.lista });
    setAviso({ tipo: "ok", texto: "Importado: " + resumen + ". " + yaEstaban + " ya estaban." + nota });
    return true;
  };

  const onArchivo = (e) => {
    const archivo = e.target.files && e.target.files[0];
    if (!archivo) return;
    const lector = new FileReader();
    lector.onload = (ev) => { importarTexto(String(ev.target.result || "")); };
    lector.onerror = () => setAviso({ tipo: "error", texto: "No se pudo leer el archivo." });
    lector.readAsText(archivo);
    e.target.value = "";
  };

  const cuentaDe = (id) => cuentas.find((c) => c.id === id);
  const entDe = (id) => entidades.find((e) => e.id === id);

  // Último precio (por fecha) al que se le registró ese material a esa persona
  const ultimoPrecio = (persona, material) => {
    const k = normMat(material);
    if (!k) return null;
    let mejor = null;
    movs.forEach((m) => {
      if (m.corresponde !== persona || m.tipo !== "gasto" || !m.pu || normMat(m.material) !== k) return;
      if (!mejor || m.fecha > mejor.fecha) mejor = m;
    });
    return mejor ? { pu: mejor.pu, unidad: mejor.unidad, fecha: mejor.fecha } : null;
  };

  // Al cambiar persona o material trae el último precio, salvo que el usuario ya haya escrito uno distinto
  const cambiarForm = (parche) => {
    const nf = { ...f, ...parche };
    if ("corresponde" in parche || "material" in parche) {
      const sinTocar = f.pu === "" || String(f.pu) === String(f.puAuto);
      if (sinTocar) {
        const ult = ultimoPrecio(nf.corresponde, nf.material);
        nf.pu = ult ? String(ult.pu) : "";
        nf.puAuto = nf.pu;
        if (ult && ult.unidad) nf.unidad = ult.unidad;
      }
    }
    setF(nf);
  };

  const agregar = () => {
    const esGasto = f.tipo === "gasto";
    const conPrecio = Boolean(esGasto && f.cant && f.pu);
    const montoCalc = conPrecio ? Math.round(Number(f.cant) * Number(f.pu) * 100) / 100 : Number(f.monto);
    const material = esGasto ? f.material.trim() : "";
    const descBase = f.desc.trim() || (material ? "Entrega de material – " + material : "");
    if (!montoCalc || montoCalc <= 0 || !descBase) return;
    const cta = cuentaDe(f.cuentaPago);
    const detalle = conPrecio ? " (" + f.cant + " " + f.unidad + " × " + fmt(f.pu) + ")" : "";
    const m = {
      id: Date.now().toString(),
      fecha: f.fecha,
      desc: descBase + detalle,
      monto: montoCalc,
      cant: esGasto && f.cant ? Number(f.cant) : null,
      unidad: f.unidad,
      pu: esGasto && f.pu ? Number(f.pu) : null,
      material: material || null,
      prestamo: esGasto && f.prestamo ? f.prestamo : null,
      tipo: f.tipo,
      pagador: cta.entidad,
      cuenta: cta.id,
      corresponde: f.corresponde,
    };
    const nuevos = [m, ...movs];
    setMovs(nuevos);
    persistir({ movs: nuevos });
    setF({ ...f, desc: "", monto: "", cant: "", puAuto: f.pu });
  };

  const borrar = (id) => {
    const nuevos = movs.filter((m) => m.id !== id);
    setMovs(nuevos);
    persistir({ movs: nuevos });
  };

  const addEntidad = () => {
    const n = nuevaEnt.trim();
    if (!n) return;
    const id = "e" + Date.now();
    const nuevas = [...entidades, { id, nombre: n, tipo: "otro", categoria: nuevaCat }];
    setEntidades(nuevas);
    persistir({ entidades: nuevas });
    setNuevaEnt("");
  };

  const cambiarCategoria = (id, categoria) => {
    const nuevas = entidades.map((e) => (e.id === id ? { ...e, categoria: categoria || undefined } : e));
    setEntidades(nuevas);
    persistir({ entidades: nuevas });
  };

  const addCuenta = () => {
    const n = nuevaCta.nombre.trim();
    if (!n) return;
    const nuevas = [...cuentas, { id: "c" + Date.now(), entidad: nuevaCta.entidad, nombre: n }];
    setCuentas(nuevas);
    persistir({ cuentas: nuevas });
    setNuevaCta({ ...nuevaCta, nombre: "" });
  };

  // ─── saldos cruzados: deuda[A|B] = cuánto le debe A a B ───
  const cruces = useMemo(() => {
    const deuda = {};
    const key = (a, b) => a + "|" + b;
    movs.forEach((m) => {
      if (m.pagador === m.corresponde) return;
      if (m.tipo === "gasto") {
        deuda[key(m.corresponde, m.pagador)] = (deuda[key(m.corresponde, m.pagador)] || 0) + m.monto;
      } else if (m.tipo === "transferencia") {
        deuda[key(m.pagador, m.corresponde)] = (deuda[key(m.pagador, m.corresponde)] || 0) - m.monto;
      } else if (m.tipo === "ingreso") {
        // dinero que entró a la cuenta de "pagador" pero corresponde a otro → el receptor lo debe
        deuda[key(m.pagador, m.corresponde)] = (deuda[key(m.pagador, m.corresponde)] || 0) + m.monto;
      }
    });
    const netos = [];
    const vistos = new Set();
    entidades.forEach((a) =>
      entidades.forEach((b) => {
        if (a.id === b.id) return;
        const k = [a.id, b.id].sort().join("|");
        if (vistos.has(k)) return;
        vistos.add(k);
        const ab = deuda[key(a.id, b.id)] || 0;
        const ba = deuda[key(b.id, a.id)] || 0;
        const neto = ab - ba;
        if (Math.abs(neto) > 0.005)
          netos.push(
            neto > 0
              ? { deudor: a.id, acreedor: b.id, monto: neto }
              : { deudor: b.id, acreedor: a.id, monto: -neto }
          );
      })
    );
    return netos.sort((x, y) => y.monto - x.monto);
  }, [movs, entidades]);

  const mesActual = hoy().slice(0, 7);
  const [mesVista, setMesVista] = useState(mesActual);
  const movsMes = movs.filter((m) => m.fecha.slice(0, 7) === mesVista);

  const resumen = useMemo(() => {
    const r = {};
    entidades.forEach((e) => (r[e.id] = { gasto: 0, ingreso: 0 }));
    movsMes.forEach((m) => {
      if (!r[m.corresponde]) return;
      if (m.tipo === "gasto") r[m.corresponde].gasto += m.monto;
      if (m.tipo === "ingreso") r[m.corresponde].ingreso += m.monto;
    });
    return r;
  }, [movsMes, entidades]);

  const porCuenta = useMemo(() => {
    const r = {};
    movsMes.forEach((m) => {
      if (m.tipo === "gasto") r[m.cuenta] = (r[m.cuenta] || 0) + m.monto;
    });
    return r;
  }, [movsMes]);

  const meses = useMemo(() => {
    const s = new Set(movs.map((m) => m.fecha.slice(0, 7)));
    s.add(mesActual);
    return [...s].sort().reverse();
  }, [movs]);

  if (cargando)
    return (
      <div style={{ background: T.bg, minHeight: "100vh", display: "grid", placeItems: "center", fontFamily: "system-ui" }}>
        Cargando…
      </div>
    );

  const st = {
    input: {
      width: "100%",
      padding: "10px 12px",
      border: "1px solid " + T.linea,
      borderRadius: 6,
      fontSize: 15,
      background: T.card,
      color: T.ink,
      boxSizing: "border-box",
      fontFamily: "inherit",
    },
    label: {
      fontSize: 11,
      textTransform: "uppercase",
      letterSpacing: "0.08em",
      color: T.gris,
      marginBottom: 4,
      display: "block",
      fontWeight: 600,
    },
    card: {
      background: T.card,
      border: "1px solid " + T.linea,
      borderRadius: 8,
      padding: 16,
      marginBottom: 12,
    },
    btnAzul: {
      padding: "10px 16px",
      background: T.azul,
      color: "#fff",
      border: "none",
      borderRadius: 6,
      fontSize: 14,
      fontWeight: 800,
      cursor: "pointer",
      fontFamily: "inherit",
    },
  };

  const mios = entidades.filter((e) => e.tipo === "mio");
  const otros = entidades.filter((e) => e.tipo !== "mio");

  const esMia = (id) => (entDe(id) || {}).tipo === "mio";
  const nombreDe = (id) => (entDe(id) || {}).nombre || "";

  // Saldo de una persona frente a TODAS mis entidades: positivo = te debe, negativo = le debes
  const estadoDe = (xid) => {
    const filas = [];
    movs.slice().reverse().forEach((m) => {
      if (m.pagador === m.corresponde) return;
      let otro = null;
      let delta = 0;
      if (m.tipo === "gasto") {
        if (m.corresponde === xid) { otro = m.pagador; delta = m.monto; }
        else if (m.pagador === xid) { otro = m.corresponde; delta = -m.monto; }
      } else if (m.tipo === "transferencia") {
        if (m.pagador === xid) { otro = m.corresponde; delta = -m.monto; }
        else if (m.corresponde === xid) { otro = m.pagador; delta = m.monto; }
      } else if (m.tipo === "ingreso") {
        if (m.pagador === xid) { otro = m.corresponde; delta = m.monto; }
        else if (m.corresponde === xid) { otro = m.pagador; delta = -m.monto; }
      }
      if (otro === null || !esMia(otro)) return;
      filas.push({ m, otro, delta });
    });
    filas.sort((a, b) => (a.m.fecha < b.m.fecha ? -1 : a.m.fecha > b.m.fecha ? 1 : 0));
    let acc = 0;
    filas.forEach((f) => {
      acc = Math.round((acc + f.delta) * 100) / 100;
      f.saldo = acc;
    });
    return { filas, saldo: acc };
  };

  const selEnt = otros.find((e) => e.id === estadoId) || null;
  const est = selEnt ? estadoDe(selEnt.id) : null;
  const multi = est ? new Set(est.filas.map((f) => f.otro)).size > 1 : false;

  const materialesUsados = (() => {
    const vistos = {};
    movs.forEach((m) => {
      const k = normMat(m.material);
      if (k && !vistos[k]) vistos[k] = m.material;
    });
    return Object.values(vistos).sort((a, b) => a.localeCompare(b, "es"));
  })();
  const ultPrecio = f.tipo === "gasto" ? ultimoPrecio(f.corresponde, f.material) : null;
  const difPrecio = ultPrecio && Number(f.pu) > 0 ? Math.round((Number(f.pu) - ultPrecio.pu) * 100) / 100 : 0;

  // Historial de precios por material para una persona: solo cuando el precio cambió
  const preciosDe = (xid) => {
    const lista = movs.slice().reverse().filter((m) => m.corresponde === xid && m.tipo === "gasto" && m.pu && normMat(m.material));
    lista.sort((a, b) => (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0));
    const grupos = {};
    lista.forEach((m) => {
      const k = normMat(m.material);
      const g = grupos[k] || (grupos[k] = { nombre: m.material, unidad: m.unidad, cambios: [] });
      g.nombre = m.material;
      g.unidad = m.unidad;
      const ult = g.cambios[g.cambios.length - 1];
      if (!ult || Math.abs(ult.pu - m.pu) > 0.004) g.cambios.push({ fecha: m.fecha, pu: m.pu });
    });
    return Object.values(grupos).sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
  };
  const precios = selEnt ? preciosDe(selEnt.id) : [];

  // Control de un préstamo recibido: lo recibido menos lo gastado (gastos marcados como pagados con él). No toca lo que se debe.
  const cent = (n) => Math.round(n * 100) / 100;
  const prestamos = otros.filter((e) => e.categoria === "prestamo");
  const resumenPrestamo = (id) => {
    const recibido = cent(movs.filter((m) => m.tipo === "ingreso" && m.corresponde === id && esMia(m.pagador)).reduce((t, m) => t + m.monto, 0));
    const gastos = movs.filter((m) => m.tipo === "gasto" && m.prestamo === id).slice().reverse();
    gastos.sort((a, b) => (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0));
    const gastado = cent(gastos.reduce((t, m) => t + m.monto, 0));
    return { recibido, gastado, porGastar: cent(recibido - gastado), gastos };
  };
  const ctrlPrestamo = selEnt && selEnt.categoria === "prestamo" ? resumenPrestamo(selEnt.id) : null;
  const infoPrestamo = f.tipo === "gasto" && f.prestamo ? resumenPrestamo(f.prestamo) : null;
  const montoForm = f.cant && f.pu ? cent(Number(f.cant) * Number(f.pu)) : Number(f.monto) || 0;
  const restantePrestamo = infoPrestamo ? cent(infoPrestamo.porGastar - montoForm) : 0;

  const bajarEstadoPNG = () => {
    const canvas = dibujarEstado(selEnt.nombre, categoriaDe(selEnt), est.filas, est.saldo, multi, nombreDe);
    canvas.toBlob((blob) => {
      if (!blob) { setAvisoEstado({ tipo: "error", texto: "No se pudo generar la imagen." }); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "estado-de-cuenta-" + selEnt.nombre.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" + hoy() + ".png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setAvisoEstado({ tipo: "ok", texto: "Imagen descargada. Mándala por WhatsApp desde tus descargas." });
    }, "image/png");
  };

  const copiarTextoEstado = async () => {
    const texto = textoEstado(selEnt.nombre, est.filas, est.saldo, multi, nombreDe);
    try {
      await navigator.clipboard.writeText(texto);
      setAvisoEstado({ tipo: "ok", texto: "Texto copiado. Pégalo en WhatsApp." });
    } catch (e) {
      window.prompt("Copia este texto:", texto);
    }
  };

  const addPendiente = () => {
    if (!nuevoPend.desc.trim() || !nuevoPend.monto || Number(nuevoPend.monto) <= 0) return;
    const nuevos = [
      ...pendientes,
      { id: "p" + Date.now(), desc: nuevoPend.desc.trim(), monto: Number(nuevoPend.monto), fecha: nuevoPend.fecha, entidad: nuevoPend.entidad },
    ].sort((a, b) => a.fecha.localeCompare(b.fecha));
    setPendientes(nuevos);
    persistir({ pendientes: nuevos });
    setNuevoPend({ ...nuevoPend, desc: "", monto: "" });
  };

  const quitarPendiente = (id) => {
    const nuevos = pendientes.filter((p) => p.id !== id);
    setPendientes(nuevos);
    persistir({ pendientes: nuevos });
  };

  const totPendientes = pendientes.reduce((s, p) => s + p.monto, 0);

  const addCobro = () => {
    if (!nuevoCobro.desc.trim() || !nuevoCobro.monto || Number(nuevoCobro.monto) <= 0) return;
    const nuevos = [
      ...porCobrar,
      { id: "q" + Date.now(), desc: nuevoCobro.desc.trim(), monto: Number(nuevoCobro.monto), fecha: nuevoCobro.fecha },
    ].sort((a, b) => a.fecha.localeCompare(b.fecha));
    setPorCobrar(nuevos);
    persistir({ porCobrar: nuevos });
    setNuevoCobro({ ...nuevoCobro, desc: "", monto: "" });
  };

  const quitarCobro = (id) => {
    const nuevos = porCobrar.filter((p) => p.id !== id);
    setPorCobrar(nuevos);
    persistir({ porCobrar: nuevos });
  };

  const totPorCobrar = porCobrar.reduce((s, p) => s + p.monto, 0);
  const diasAtraso = (fecha) => Math.floor((new Date(hoy()) - new Date(fecha)) / 86400000);

  const totDebo = cruces.filter((c) => esMia(c.deudor) && !esMia(c.acreedor)).reduce((s, c) => s + c.monto, 0);
  const totMeDeben = cruces.filter((c) => !esMia(c.deudor) && esMia(c.acreedor)).reduce((s, c) => s + c.monto, 0);
  const totInterno = cruces.filter((c) => esMia(c.deudor) && esMia(c.acreedor)).reduce((s, c) => s + c.monto, 0);

  return (
    <div style={{ background: T.bg, minHeight: "100vh", fontFamily: "'Archivo', system-ui, sans-serif", color: T.ink }}>
      <style>{"button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid " + T.azul + "; outline-offset: 1px; } .mono { font-family: 'IBM Plex Mono', monospace; }"}</style>

      <header style={{ background: T.azul, color: "#fff", padding: "18px 16px 14px" }}>
        <div style={{ maxWidth: 560, margin: "0 auto" }}>
          <div style={{ fontSize: 11, letterSpacing: "0.15em", textTransform: "uppercase", opacity: 0.75 }}>
            Vale de obra · finanzas
          </div>
          <h1 style={{ margin: "2px 0 0", fontSize: 22, fontWeight: 800 }}>Cruces y saldos</h1>
        </div>
      </header>

      <nav style={{ display: "flex", maxWidth: 560, margin: "0 auto", borderBottom: "1px solid " + T.linea }}>
        {[
          ["registrar", "Registrar"],
          ["cruces", "Cruces"],
          ["estados", "Estados"],
          ["resumen", "Resumen"],
          ["directorio", "Directorio"],
        ].map(([id, lbl]) => (
          <button
            key={id}
            onClick={() => setTab(id)}
            style={{
              flex: 1,
              padding: "12px 0",
              background: "none",
              border: "none",
              borderBottom: tab === id ? "3px solid " + T.azul : "3px solid transparent",
              fontWeight: tab === id ? 800 : 400,
              fontSize: 13,
              color: tab === id ? T.azul : T.gris,
              cursor: "pointer",
              fontFamily: "inherit",
            }}
          >
            {lbl}
            {id === "cruces" && cruces.length > 0 && (
              <span
                className="mono"
                style={{ marginLeft: 5, background: T.alerta, color: "#fff", borderRadius: 10, padding: "1px 6px", fontSize: 11 }}
              >
                {cruces.length}
              </span>
            )}
          </button>
        ))}
      </nav>

      <main style={{ maxWidth: 560, margin: "0 auto", padding: 16 }}>
        {guardado && <div style={{ fontSize: 12, color: T.ok, marginBottom: 8, textAlign: "right" }}>{guardado}</div>}

        {/* ─── REGISTRAR ─── */}
        {tab === "registrar" && (
          <>
            <div style={st.card}>
              <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
                {[
                  ["gasto", "Gasto / Surtido"],
                  ["ingreso", "Ingreso"],
                  ["transferencia", "Transferencia / Abono"],
                ].map(([v, lbl]) => (
                  <button
                    key={v}
                    onClick={() => setF({ ...f, tipo: v })}
                    style={{
                      flex: 1,
                      padding: "8px 4px",
                      borderRadius: 6,
                      border: "1px solid " + (f.tipo === v ? T.azul : T.linea),
                      background: f.tipo === v ? T.azulSuave : T.card,
                      color: f.tipo === v ? T.azul : T.gris,
                      fontWeight: f.tipo === v ? 700 : 400,
                      fontSize: 12,
                      cursor: "pointer",
                      fontFamily: "inherit",
                    }}
                  >
                    {lbl}
                  </button>
                ))}
              </div>

              <div style={{ display: "grid", gap: 10 }}>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  <div>
                    <label style={st.label}>Fecha</label>
                    <input type="date" value={f.fecha} onChange={(e) => setF({ ...f, fecha: e.target.value })} style={st.input} />
                  </div>
                  <div>
                    <label style={st.label}>Monto (MXN)</label>
                    <input
                      type="number"
                      inputMode="decimal"
                      placeholder="0.00"
                      value={f.monto}
                      onChange={(e) => setF({ ...f, monto: e.target.value })}
                      style={st.input}
                      className="mono"
                    />
                  </div>
                </div>

                {f.tipo === "gasto" && (
                  <>
                    <div>
                      <label style={st.label}>Material</label>
                      <input
                        list="materiales-usados"
                        placeholder="Ej. cemento, varilla, arena…"
                        value={f.material}
                        onChange={(e) => cambiarForm({ material: e.target.value })}
                        style={st.input}
                      />
                      <datalist id="materiales-usados">
                        {materialesUsados.map((n) => (
                          <option key={n} value={n} />
                        ))}
                      </datalist>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
                      <div>
                        <label style={st.label}>Cantidad</label>
                        <input type="number" inputMode="decimal" placeholder="opcional" value={f.cant} onChange={(e) => setF({ ...f, cant: e.target.value })} style={st.input} className="mono" />
                      </div>
                      <div>
                        <label style={st.label}>Unidad</label>
                        <select value={f.unidad} onChange={(e) => setF({ ...f, unidad: e.target.value })} style={st.input}>
                          <option value="ton">ton</option>
                          <option value="saco">saco</option>
                          <option value="m3">m³</option>
                          <option value="pza">pieza</option>
                          <option value="m2">m²</option>
                          <option value="ml">ml</option>
                        </select>
                      </div>
                      <div>
                        <label style={st.label}>Precio unit.</label>
                        <input type="number" inputMode="decimal" placeholder="opcional" value={f.pu} onChange={(e) => setF({ ...f, pu: e.target.value })} style={st.input} className="mono" />
                      </div>
                    </div>
                    {f.material.trim() && (
                      <div style={{ fontSize: 12, color: T.gris }}>
                        {ultPrecio
                          ? "Último precio a " + nombreDe(f.corresponde) + ": " + fmt(ultPrecio.pu) + " por " + ultPrecio.unidad + " (" + fechaMX(ultPrecio.fecha) + ")"
                          : "Primera vez que registras este material para " + nombreDe(f.corresponde) + ": no hay precio anterior."}
                        {difPrecio !== 0 && (
                          <strong style={{ color: difPrecio > 0 ? T.alerta : T.ok }}>
                            {" · " + (difPrecio > 0 ? "↑ sube " : "↓ baja ") + fmt(Math.abs(difPrecio)) + " (" + (Math.abs(difPrecio) / ultPrecio.pu * 100).toFixed(1) + "%)"}
                          </strong>
                        )}
                      </div>
                    )}
                    {f.cant && f.pu && (
                      <div style={{ fontSize: 13, color: T.azul, background: T.azulSuave, borderRadius: 6, padding: "8px 10px" }}>
                        Total calculado: <strong className="mono">{fmt(Math.round(Number(f.cant) * Number(f.pu) * 100) / 100)}</strong>
                      </div>
                    )}
                  </>
                )}

                <div>
                  <label style={st.label}>{f.tipo === "gasto" && f.material.trim() ? "Descripción (opcional)" : "Descripción"}</label>
                  <input
                    placeholder="Ej. surtido de cemento a primo, abono tarjeta papá…"
                    value={f.desc}
                    onChange={(e) => setF({ ...f, desc: e.target.value })}
                    style={st.input}
                  />
                </div>

                <div>
                  <label style={st.label}>
                    {f.tipo === "ingreso" ? "Entra a la cuenta" : f.tipo === "transferencia" ? "Sale de (quién paga)" : "¿Con qué se pagó?"}
                  </label>
                  <select value={f.cuentaPago} onChange={(e) => setF({ ...f, cuentaPago: e.target.value })} style={st.input}>
                    {cuentas.map((c) => (
                      <option key={c.id} value={c.id}>
                        {c.nombre} — {(entDe(c.entidad) || {}).nombre}
                      </option>
                    ))}
                  </select>
                </div>

                {(
                  <div>
                    <label style={st.label}>
                      {f.tipo === "transferencia" ? "Llega a (quién recibe)" : f.tipo === "ingreso" ? "¿A quién corresponde el ingreso?" : "¿A quién corresponde el gasto?"}
                    </label>
                    <select value={f.corresponde} onChange={(e) => cambiarForm({ corresponde: e.target.value })} style={st.input}>
                      <optgroup label="Mis entidades">
                        {mios.map((e) => (
                          <option key={e.id} value={e.id}>{e.nombre}</option>
                        ))}
                      </optgroup>
                      <optgroup label="Personas y otros negocios">
                        {otros.map((e) => (
                          <option key={e.id} value={e.id}>{e.nombre}</option>
                        ))}
                      </optgroup>
                    </select>
                  </div>
                )}

                {f.tipo === "gasto" && prestamos.length > 0 && (
                  <div>
                    <label style={st.label}>¿Se pagó con un préstamo?</label>
                    <select value={f.prestamo} onChange={(e) => setF({ ...f, prestamo: e.target.value })} style={st.input}>
                      <option value="">No</option>
                      {prestamos.map((p) => (
                        <option key={p.id} value={p.id}>{"Sí, con " + p.nombre}</option>
                      ))}
                    </select>
                    {infoPrestamo && (
                      <div style={{ fontSize: 12, marginTop: 6, color: restantePrestamo < 0 ? T.alerta : T.azul }}>
                        {"Préstamo: recibido " + fmt(infoPrestamo.recibido) + " · gastado " + fmt(infoPrestamo.gastado) + " · por gastar " + fmt(infoPrestamo.porGastar) +
                          (montoForm > 0 ? " → con este gasto " + (restantePrestamo >= 0 ? "quedarían " + fmt(restantePrestamo) : "te pasarías " + fmt(-restantePrestamo)) : "")}
                      </div>
                    )}
                  </div>
                )}

                {f.tipo === "gasto" && cuentaDe(f.cuentaPago) && cuentaDe(f.cuentaPago).entidad !== f.corresponde && (
                  <div style={{ background: "#FBEEE7", border: "1px solid " + T.alerta, color: T.alerta, borderRadius: 6, padding: "8px 10px", fontSize: 13 }}>
                    ⚠ Cruce: {(entDe(f.corresponde) || {}).nombre} quedará debiendo a {(entDe(cuentaDe(f.cuentaPago).entidad) || {}).nombre}
                  </div>
                )}
                {f.tipo === "ingreso" && cuentaDe(f.cuentaPago) && cuentaDe(f.cuentaPago).entidad !== f.corresponde && (
                  <div style={{ background: "#FBEEE7", border: "1px solid " + T.alerta, color: T.alerta, borderRadius: 6, padding: "8px 10px", fontSize: 13 }}>
                    ⚠ Cobro cruzado: {(entDe(cuentaDe(f.cuentaPago).entidad) || {}).nombre} quedará debiendo a {(entDe(f.corresponde) || {}).nombre}
                  </div>
                )}
                {f.tipo === "transferencia" && cuentaDe(f.cuentaPago) && cuentaDe(f.cuentaPago).entidad !== f.corresponde && (
                  <div style={{ background: T.azulSuave, color: T.azul, borderRadius: 6, padding: "8px 10px", fontSize: 13 }}>
                    Esto abona a la deuda de {(entDe(cuentaDe(f.cuentaPago).entidad) || {}).nombre} con {(entDe(f.corresponde) || {}).nombre} (o crea saldo a favor).
                  </div>
                )}

                <button onClick={agregar} style={{ ...st.btnAzul, padding: "12px 0", fontSize: 15 }}>
                  Registrar movimiento
                </button>

            <div style={st.card}>
              {cuentas.map((c) => (
                <div key={c.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid " + T.linea, fontSize: 14 }}>
                  <span>{c.nombre}</span>
                  <span style={{ color: T.gris, fontSize: 12 }}>{((entDe(c.entidad) || {}).nombre || "")}</span>
                </div>
              ))}
              <div style={{ display: "grid", gap: 8, marginTop: 12 }}>
                <input
                  placeholder="Nueva cuenta o tarjeta"
                  value={nuevaCta.nombre}
                  onChange={(e) => setNuevaCta({ ...nuevaCta, nombre: e.target.value })}
                  style={st.input}
                />
                <div style={{ display: "flex", gap: 8 }}>
                  <select
                    value={nuevaCta.entidad}
                    onChange={(e) => setNuevaCta({ ...nuevaCta, entidad: e.target.value })}
                    style={{ ...st.input, flex: 1 }}
                  >
                    {entidades.map((e) => (
                      <option key={e.id} value={e.id}>{e.nombre}</option>
                    ))}
                  </select>
                  <button onClick={addCuenta} style={st.btnAzul}>+</button>
                </div>
              </div>
            </div>

            <div style={{ ...st.label, marginTop: 16 }}>Respaldo y traspaso</div>
            <div style={st.card}>
              <div style={{ fontSize: 13, color: T.gris, marginBottom: 10 }}>
                Descarga una copia de todo (movimientos, pendientes, por cobrar, personas y cuentas). Para pasar los datos a otro dispositivo o compartirlos con otra persona: exporta aquí e importa allá. Al importar se combina por id y nunca se borra ni se cambia lo que ya tienes. Los borrados no viajan.
              </div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button onClick={exportarJSON} style={st.btnAzul}>⬇ Exportar respaldo</button>
                <label style={{ ...st.btnAzul, background: T.azulSuave, color: T.azul, display: "inline-block" }}>
                  ⬆ Importar archivo
                  <input type="file" accept=".json,application/json" onChange={onArchivo} style={{ display: "none" }} />
                </label>
              </div>
              <textarea
                placeholder="…o pega aquí el contenido de un respaldo"
                value={pegado}
                onChange={(e) => setPegado(e.target.value)}
                style={{ ...st.input, marginTop: 10, height: 80, resize: "vertical", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12 }}
              />
              <button
                onClick={() => { if (pegado.trim() && importarTexto(pegado)) setPegado(""); }}
                style={{ ...st.btnAzul, marginTop: 8, background: T.azulSuave, color: T.azul }}
              >
                Importar lo pegado
              </button>
              {aviso && (
                <div style={{ marginTop: 10, fontSize: 13, padding: "8px 10px", borderRadius: 6, background: aviso.tipo === "error" ? "#FBEEE7" : "#E7F1EA", color: aviso.tipo === "error" ? T.alerta : T.ok, border: "1px solid " + (aviso.tipo === "error" ? T.alerta : T.ok) }}>
                  {aviso.texto}
                </div>
              )}
            </div>
          </>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(FinanzasCruzadas));
</script></body></html>
