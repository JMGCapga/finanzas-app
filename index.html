<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finanzas — Control de operación</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0A0E27;
      color: #FFFFFF;
    }
    input, select, button {
      font-family: inherit;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCvG_uwMVnsTMt7bGkp02FtXEvDS1C0qRM",
      authDomain: "finanzas-jm.firebaseapp.com",
      databaseURL: "https://finanzas-jm-default-rtdb.firebaseio.com",
      projectId: "finanzas-jm",
      storageBucket: "finanzas-jm.firebasestorage.app",
      messagingSenderId: "641199393308",
      appId: "1:641199393308:web:2e442ee3ac410198856dd9"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const KEY = "finanzas-app:v5";
    const COLORES = {
      fondo: "#0A0E27",
      fondoCard: "#111B3C",
      fondoHover: "#1A2847",
      texto: "#FFFFFF",
      textoSecundario: "#A0AEC0",
      acento: "#00D9FF",
      acentoVerde: "#10B981",
      acentoRojo: "#EF4444",
      accentoOrange: "#F97316",
      borde: "#1E3A5F",
    };

    function cargar() {
      try {
        const data = localStorage.getItem(KEY);
        if (data) return JSON.parse(data);
      } catch (e) {}
      return null;
    }

    function guardar(data) {
      try {
        localStorage.setItem(KEY, JSON.stringify(data));
        db.ref("finanzas/data").set(data).catch(() => {});
        return true;
      } catch (e) {
        return false;
      }
    }

    const SEMILLA = {
      cuentas: [
        { id: "c1", nombre: "Hermano", rol: "Edgar · Nómina", nota: "" },
        { id: "c2", nombre: "Lalo", rol: "Primo · Cliente", nota: "" },
        { id: "c3", nombre: "Papá", rol: "Familia", nota: "" },
        { id: "c4", nombre: "JMGC", rol: "Razón social", nota: "" },
        { id: "c5", nombre: "Cemcoyaa", rol: "Razón social", nota: "" },
        { id: "c6", nombre: "Itzayana", rol: "Razón social", nota: "" },
      ],
      movimientos: [
        { id: "m1", cuentaId: "c1", fecha: "2026-07-13", concepto: "Nómina", monto: 47470.64, tipo: "recibi", medio: "nómina", creado: 1725811200000 },
        { id: "m2", cuentaId: "c1", fecha: "2026-07-28", concepto: "Nómina", monto: 40995.15, tipo: "recibi", medio: "nómina", creado: 1725897600000 },
        { id: "m3", cuentaId: "c1", fecha: "2026-08-13", concepto: "Nómina", monto: 44232.89, tipo: "recibi", medio: "nómina", creado: 1726161600000 },
        { id: "m4", cuentaId: "c1", fecha: "2026-08-28", concepto: "Nómina", monto: 44232.9, tipo: "recibi", medio: "nómina", creado: 1726248000000 },
        { id: "m5", cuentaId: "c1", fecha: "2026-09-08", concepto: "Entregas julio-agosto: efectivo, transferencias, descuentos de deuda", monto: 181000, tipo: "entregue", medio: "acumulado", creado: 1725811200000 },
      ],
      cortes: [
        { id: "corte1", cuentaId: "c1", fecha: "2026-09-08", saldo: 4068.42, liquidado: false },
      ],
      obligaciones: [],
      pendientes: [],
    };

    const mxn = (n) =>
      (n < 0 ? "-" : "") +
      "$" +
      Math.abs(n).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const hoy = () => new Date().toISOString().slice(0, 10);
    const uid = () => Math.random().toString(36).slice(2, 10);
    const efecto = (mov) => (mov.tipo === "recibi" ? -mov.monto : mov.monto);
    const fechaCorta = (f) => {
      const [a, m, d] = f.split("-");
      return `${d}/${m}`;
    };

    function descargarEstadoDeCuenta(cuenta, movimientos, saldoFinal) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const ancho = 900;
      const alto = 1200;
      canvas.width = ancho;
      canvas.height = alto;

      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, ancho, alto);

      ctx.fillStyle = "#0A0E27";
      ctx.font = "bold 28px Arial";
      ctx.fillText("ESTADO DE CUENTA", 40, 60);
      ctx.font = "20px Arial";
      ctx.fillText(cuenta.nombre + " — " + cuenta.rol, 40, 100);

      ctx.font = "12px Arial";
      ctx.fillStyle = "#666";
      const hoyStr = new Date().toLocaleDateString("es-MX");
      ctx.fillText("Generado: " + hoyStr, 40, 130);

      const filaAltura = 40;
      const colFecha = 40;
      const colConcepto = 140;
      const colRecibiste = 620;
      const colEntregaste = 750;
      const colSaldo = 850;

      let y = 180;

      ctx.fillStyle = "#0A0E27";
      ctx.font = "bold 12px Arial";
      ctx.fillText("Fecha", colFecha, y);
      ctx.fillText("Concepto", colConcepto, y);
      ctx.fillText("Recibiste", colRecibiste, y);
      ctx.fillText("Entregaste", colEntregaste, y);
      ctx.fillText("Saldo", colSaldo, y);

      ctx.strokeStyle = "#CCC";
      ctx.beginPath();
      ctx.moveTo(40, y + 10);
      ctx.lineTo(ancho - 40, y + 10);
      ctx.stroke();

      y += 40;

      let saldoAcumulado = 0;
      ctx.font = "11px Arial";
      ctx.fillStyle = "#333";

      movimientos.forEach((mov) => {
        saldoAcumulado += efecto(mov);

        const fecha = fechaCorta(mov.fecha);
        const concepto = mov.concepto.substring(0, 40);
        const recibiste = mov.tipo === "recibi" ? mxn(mov.monto) : "";
        const entregaste = mov.tipo === "entregue" ? mxn(mov.monto) : "";
        const saldo = mxn(saldoAcumulado);

        ctx.fillText(fecha, colFecha, y);
        ctx.fillText(concepto, colConcepto, y);
        ctx.fillStyle = mov.tipo === "recibi" ? "#10B981" : "#333";
        ctx.fillText(recibiste, colRecibiste, y);
        ctx.fillStyle = mov.tipo === "entregue" ? "#EF4444" : "#333";
        ctx.fillText(entregaste, colEntregaste, y);
        ctx.fillStyle = saldoAcumulado < 0 ? "#EF4444" : "#10B981";
        ctx.fillText(saldo, colSaldo, y);

        y += filaAltura;
        ctx.fillStyle = "#333";
      });

      ctx.strokeStyle = "#000";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(40, y);
      ctx.lineTo(ancho - 40, y);
      ctx.stroke();

      y += 30;

      ctx.font = "bold 16px Arial";
      ctx.fillStyle = saldoFinal < 0 ? "#EF4444" : "#10B981";
      const textoSaldo = saldoFinal < 0 ? "DEBE: " + mxn(-saldoFinal) : "A FAVOR: " + mxn(saldoFinal);
      ctx.fillText(textoSaldo, 40, y);

      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `cuenta-${cuenta.nombre}-${hoyStr.replace(/\//g, "-")}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    }

    function FinanzasApp() {
      const [data, setData] = useState(null);
      const [cargando, setCargando] = useState(true);
      const [vista, setVista] = useState("dashboard");
      const [cuentaActiva, setCuentaActiva] = useState(null);
      const [dragActive, setDragActive] = useState(false);
      const [sincronizado, setSincronizado] = useState(false);
      const primerRender = useRef(true);

      useEffect(() => {
        const guardado = cargar();
        const d = guardado || SEMILLA;
        setData(d);
        setCuentaActiva(d.cuentas[0]?.id ?? null);
        setCargando(false);

        const listener = db.ref("finanzas/data").on("value", (snapshot) => {
          const firebaseData = snapshot.val();
          if (firebaseData && JSON.stringify(firebaseData) !== JSON.stringify(d)) {
            setData(firebaseData);
            localStorage.setItem(KEY, JSON.stringify(firebaseData));
            setSincronizado(true);
            setTimeout(() => setSincronizado(false), 2000);
          }
        });

        return () => {
          db.ref("finanzas/data").off("value", listener);
        };
      }, []);

      useEffect(() => {
        if (primerRender.current) {
          if (data) primerRender.current = false;
          return;
        }
        if (!data) return;
        guardar(data);
      }, [data]);

      const cuenta = useMemo(() => data?.cuentas.find((c) => c.id === cuentaActiva) ?? null, [data, cuentaActiva]);

      const saldos = useMemo(() => {
        if (!data) return {};
        const m = {};
        data.cuentas.forEach((c) => (m[c.id] = 0));
        data.movimientos.forEach((mov) => {
          if (m[mov.cuentaId] === undefined) m[mov.cuentaId] = 0;
          m[mov.cuentaId] += efecto(mov);
        });
        return m;
      }, [data]);

      const totales = useMemo(() => {
        let debo = 0,
          medeben = 0;
        Object.values(saldos).forEach((s) => {
          if (s < 0) debo += -s;
          else medeben += s;
        });
        let obligaciones = 0;
        data?.obligaciones?.forEach((o) => (obligaciones += o.monto));
        return { debo, medeben, neto: medeben - debo, obligaciones };
      }, [saldos, data]);

      const handleDrag = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setDragActive(e.type === "dragenter" || e.type === "dragover");
      };

      const handleDrop = async (e) => {
        e.preventDefault();
        e.stopPropagation();
        setDragActive(false);

        const files = e.dataTransfer.files;
        for (let file of files) {
          if (file.type === "application/json") {
            const text = await file.text();
            try {
              const importedData = JSON.parse(text);
              setData(importedData);
              guardar(importedData);
            } catch (err) {
              alert("Error al importar el archivo JSON");
            }
          }
        }
      };

      const importarJSON = () => {
        const textarea = document.getElementById("jsonInput");
        if (!textarea || !textarea.value.trim()) {
          alert("Pegá el JSON primero");
          return;
        }
        try {
          const importedData = JSON.parse(textarea.value);
          setData(importedData);
          guardar(importedData);
          textarea.value = "";
          alert("✅ Datos importados correctamente");
        } catch (err) {
          alert("❌ El JSON no es válido. Revisá que esté bien pegado.");
        }
      };

      if (cargando)
        return (
          <div style={{ background: COLORES.fondo, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: COLORES.textoSecundario }}>
            Abriendo…
          </div>
        );

      return (
        <div style={{ background: COLORES.fondo, color: COLORES.texto, minHeight: "100vh" }}>
          <div style={{ maxWidth: 1400, margin: "0 auto", padding: "40px 24px 100px" }}>
            {/* encabezado */}
            <header style={{ marginBottom: 48 }}>
              <div style={{ marginBottom: 32, display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                <div>
                  <h1 style={{ fontSize: 42, fontWeight: 700, letterSpacing: "-0.02em", marginBottom: 8 }}>Finanzas</h1>
                  <p style={{ fontSize: 15, color: COLORES.textoSecundario }}>Control total de tu operación — sincronizado automáticamente entre dispositivos. 🔄</p>
                </div>
                {sincronizado && (
                  <div style={{ fontSize: 12, color: COLORES.acentoVerde, fontWeight: 600, padding: "8px 12px", background: COLORES.fondoCard, borderRadius: 6 }}>
                    ✅ Sincronizado
                  </div>
                )}
              </div>

              {/* nav */}
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8, borderBottom: `1px solid ${COLORES.borde}`, paddingBottom: 12 }}>
                {[
                  { id: "dashboard", label: "📊 Dashboard" },
                  { id: "libreta", label: "📖 Libreta" },
                  { id: "obligaciones", label: "📋 Obligaciones" },
                  { id: "cruces", label: "🔄 Cruces" },
                  { id: "pendientes", label: "⏰ Pendientes" },
                ].map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => setVista(tab.id)}
                    style={{
                      padding: "10px 16px",
                      fontSize: 13,
                      fontWeight: vista === tab.id ? 600 : 400,
                      background: vista === tab.id ? COLORES.fondoCard : "transparent",
                      border: `1px solid ${vista === tab.id ? COLORES.acento : "transparent"}`,
                      color: vista === tab.id ? COLORES.acento : COLORES.textoSecundario,
                      cursor: "pointer",
                      borderRadius: 8,
                      transition: "all 0.2s",
                    }}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>
            </header>

            {/* importar json */}
            <div style={{ marginBottom: 32 }}>
              <div style={{ marginBottom: 16 }}>
                <h3 style={{ fontSize: 14, fontWeight: 600, color: COLORES.textoSecundario, marginBottom: 8 }}>💾 Importar datos</h3>
              </div>

              <div
                onDragEnter={handleDrag}
                onDragLeave={handleDrag}
                onDragOver={handleDrag}
                onDrop={handleDrop}
                style={{
                  border: `2px dashed ${dragActive ? COLORES.acento : COLORES.borde}`,
                  borderRadius: 12,
                  padding: 24,
                  background: dragActive ? COLORES.fondoHover : "transparent",
                  marginBottom: 12,
                  transition: "all 0.2s",
                  textAlign: "center",
                  cursor: "pointer",
                }}
              >
                <div style={{ fontSize: 13, color: dragActive ? COLORES.acento : COLORES.textoSecundario }}>
                  Arrastra un JSON aquí
                </div>
              </div>

              <div style={{ background: COLORES.fondoCard, border: `1px solid ${COLORES.borde}`, borderRadius: 12, padding: 16 }}>
                <label style={{ fontSize: 12, color: COLORES.textoSecundario, display: "block", marginBottom: 8 }}>O pega el JSON aquí:</label>
                <textarea
                  id="jsonInput"
                  placeholder='Pegá el contenido del JSON (ejemplo: {"cuentas": [...], "movimientos": [...]})'
                  style={{
                    width: "100%",
                    height: 150,
                    padding: 12,
                    fontSize: 12,
                    fontFamily: "monospace",
                    background: COLORES.fondo,
                    border: `1px solid ${COLORES.borde}`,
                    color: COLORES.texto,
                    borderRadius: 8,
                    marginBottom: 12,
                    resize: "none",
                  }}
                />
                <button
                  onClick={() => importarJSON()}
                  style={{
                    background: COLORES.acento,
                    color: COLORES.fondo,
                    padding: "8px 16px",
                    fontSize: 12,
                    fontWeight: 600,
                    borderRadius: 6,
                    cursor: "pointer",
                    border: "none",
                  }}
                >
                  ✅ Importar JSON
                </button>
              </div>
            </div>

            {/* contenido por vista */}
            {vista === "dashboard" && <VistaDashboard data={data} totales={totales} saldos={saldos} cuentas={data?.cuentas} />}
            {vista === "libreta" && (
              <VistaLibreta data={data} setData={setData} cuenta={cuenta} saldos={saldos} cuentas={data?.cuentas} cuentaActiva={cuentaActiva} setCuentaActiva={setCuentaActiva} />
            )}
            {vista === "obligaciones" && (
              <VistaObligaciones data={data} setData={setData} cuenta={cuenta} cuentas={data?.cuentas} cuentaActiva={cuentaActiva} setCuentaActiva={setCuentaActiva} />
            )}
            {vista === "cruces" && <VistaCruces data={data} setData={setData} cuentas={data?.cuentas} />}
            {vista === "pendientes" && <VistaPendientes data={data} setData={setData} cuentas={data?.cuentas} />}
          </div>
        </div>
      );
    }

    function VistaDashboard({ data, totales, saldos, cuentas }) {
      return (
        <div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 16, marginBottom: 32 }}>
            <Card label="En movimiento" valor={totales.neto} color={totales.neto < 0 ? COLORES.acentoRojo : COLORES.acentoVerde} highlight />
            <Card label="Te deben" valor={totales.medeben} color={COLORES.acentoVerde} />
            <Card label="Debes" valor={totales.debo} color={COLORES.acentoRojo} />
            <Card label="Obligaciones" valor={totales.obligaciones} color={COLORES.accentoOrange} />
          </div>

          <div>
            <h2 style={{ fontSize: 18, fontWeight: 600, marginBottom: 16 }}>Saldos por cuenta</h2>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 16 }}>
              {cuentas?.map((c) => {
                const s = saldos[c.id] ?? 0;
                const color = s < 0 ? COLORES.acentoRojo : s > 0 ? COLORES.acentoVerde : COLORES.textoSecundario;
                return (
                  <div
                    key={c.id}
                    style={{
                      background: COLORES.fondoCard,
                      border: `1px solid ${COLORES.borde}`,
                      borderRadius: 12,
                      padding: 20,
                    }}
                  >
                    <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 4 }}>{c.nombre}</div>
                    <div style={{ fontSize: 12, color: COLORES.textoSecundario, marginBottom: 12 }}>{c.rol}</div>
                    <div style={{ fontSize: 24, fontWeight: 700, color }}>{s === 0 ? "—" : mxn(s)}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    function Card({ label, valor, color, highlight }) {
      return (
        <div
          style={{
            background: highlight ? COLORES.fondoHover : COLORES.fondoCard,
            border: `1px solid ${COLORES.borde}`,
            borderRadius: 12,
            padding: 24,
            boxShadow: highlight ? `0 0 20px rgba(0, 217, 255, 0.1)` : "none",
          }}
        >
          <div style={{ fontSize: 12, color: COLORES.textoSecundario, marginBottom: 8 }}>{label}</div>
          <div style={{ fontSize: 32, fontWeight: 700, color }}>{mxn(valor)}</div>
        </div>
      );
    }

    function VistaLibreta({ data, setData, cuenta, saldos, cuentas, cuentaActiva, setCuentaActiva }) {
      const [fecha, setFecha] = useState(hoy());
      const [concepto, setConcepto] = useState("");
      const [monto, setMonto] = useState("");
      const [tipo, setTipo] = useState("recibi");

      const movsDeCuenta = useMemo(
        () =>
          cuenta
            ? data.movimientos
                .filter((m) => m.cuentaId === cuenta.id)
                .sort((a, b) => (a.fecha === b.fecha ? b.creado - a.creado : a.fecha < b.fecha ? 1 : -1))
            : [],
        [data, cuenta]
      );

      const saldoActual = useMemo(() => movsDeCuenta.reduce((s, m) => s + efecto(m), 0), [movsDeCuenta]);

      const agregarMov = () => {
        const n = parseFloat(String(monto).replace(/[^0-9.]/g, ""));
        if (!n || !concepto.trim()) return;
        setData((d) => ({
          ...d,
          movimientos: [...d.movimientos, { id: uid(), cuentaId: cuenta.id, fecha, concepto: concepto.trim(), monto: n, tipo, medio: "manual", creado: Date.now() }],
        }));
        setConcepto("");
        setMonto("");
      };

      const borrarMov = (id) => {
        setData((d) => ({ ...d, movimientos: d.movimientos.filter((m) => m.id !== id) }));
      };

      const inp = {
        background: COLORES.fondoCard,
        border: `1px solid ${COLORES.borde}`,
        padding: "10px 12px",
        fontSize: 13,
        color: COLORES.texto,
        borderRadius: 6,
        outline: "none",
      };

      return (
        <div style={{ display: "flex", gap: 24 }}>
          <aside style={{ width: 280, flexShrink: 0 }}>
            <h3 style={{ fontSize: 12, fontWeight: 600, color: COLORES.textoSecundario, marginBottom: 12, textTransform: "uppercase" }}>Cuentas</h3>
            {cuentas?.map((c) => (
              <button
                key={c.id}
                onClick={() => setCuentaActiva(c.id)}
                style={{
                  width: "100%",
                  textAlign: "left",
                  padding: "12px 14px",
                  background: c.id === cuentaActiva ? COLORES.fondoCard : "transparent",
                  border: `1px solid ${c.id === cuentaActiva ? COLORES.acento : "transparent"}`,
                  borderRadius: 8,
                  marginBottom: 6,
                  cursor: "pointer",
                  transition: "all 0.2s",
                }}
              >
                <div style={{ fontSize: 14, fontWeight: c.id === cuentaActiva ? 600 : 400, color: COLORES.texto }}>{c.nombre}</div>
                <div style={{ fontSize: 11, color: COLORES.textoSecundario, marginTop: 4 }}>{c.rol}</div>
              </button>
            ))}
          </aside>

          <div style={{ flex: 1 }}>
            {!cuenta ? (
              <p>Selecciona una cuenta</p>
            ) : (
              <>
                <h2 style={{ fontSize: 28, fontWeight: 700, marginBottom: 8 }}>{cuenta.nombre}</h2>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
                  <p style={{ fontSize: 14, color: COLORES.textoSecundario }}>
                    Saldo: <span style={{ color: saldoActual < 0 ? COLORES.acentoRojo : COLORES.acentoVerde, fontWeight: 600 }}>{mxn(saldoActual)}</span>
                  </p>
                  <button
                    onClick={() => descargarEstadoDeCuenta(cuenta, movsDeCuenta, saldoActual)}
                    style={{
                      background: COLORES.acento,
                      color: COLORES.fondo,
                      padding: "8px 16px",
                      fontSize: 12,
                      fontWeight: 600,
                      borderRadius: 6,
                      cursor: "pointer",
                      border: "none",
                    }}
                  >
                    📥 Descargar estado
                  </button>
                </div>

                <div style={{ background: COLORES.fondoCard, border: `1px solid ${COLORES.borde}`, borderRadius: 12, padding: 20, marginBottom: 24 }}>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 16 }}>
                    <input type="date" value={fecha} onChange={(e) => setFecha(e.target.value)} style={{ ...inp, width: 160 }} />
                    <input
                      placeholder="Concepto"
                      value={concepto}
                      onChange={(e) => setConcepto(e.target.value)}
                      onKeyDown={(e) => e.key === "Enter" && agregarMov()}
                      style={{ ...inp, flex: 1, minWidth: 180 }}
                    />
                    <input
                      placeholder="Monto"
                      value={monto}
                      onChange={(e) => setMonto(e.target.value)}
                      onKeyDown={(e) => e.key === "Enter" && agregarMov()}
                      style={{ ...inp, width: 120 }}
                    />
                    <button
                      onClick={agregarMov}
                      style={{
                        background: COLORES.acento,
                        color: COLORES.fondo,
                        padding: "10px 20px",
                        borderRadius: 6,
                        cursor: "pointer",
                        fontWeight: 600,
                        border: "none",
                      }}
                    >
                      Anotar
                    </button>
                  </div>
                  <div style={{ display: "flex", gap: 24, fontSize: 13 }}>
                    <label style={{ cursor: "pointer", display: "flex", gap: 6, alignItems: "center" }}>
                      <input type="radio" checked={tipo === "recibi"} onChange={() => setTipo("recibi")} />
                      Recibí
                    </label>
                    <label style={{ cursor: "pointer", display: "flex", gap: 6, alignItems: "center" }}>
                      <input type="radio" checked={tipo === "entregue"} onChange={() => setTipo("entregue")} />
                      Entregué
                    </label>
                  </div>
                </div>

                <div style={{ background: COLORES.fondoCard, border: `1px solid ${COLORES.borde}`, borderRadius: 12, overflow: "hidden" }}>
                  {movsDeCuenta.length === 0 ? (
                    <p style={{ padding: 20, color: COLORES.textoSecundario, textAlign: "center" }}>Sin movimientos</p>
                  ) : (
                    <>
                      <div
                        style={{
                          display: "grid",
                          gridTemplateColumns: "60px 1fr 120px 120px 140px 40px",
                          gap: 12,
                          padding: "12px 16px",
                          borderBottom: `1px solid ${COLORES.borde}`,
                          fontSize: 12,
                          color: COLORES.textoSecundario,
                          fontWeight: 600,
                        }}
                      >
                        <div>Fecha</div>
                        <div>Concepto</div>
                        <div style={{ textAlign: "right" }}>Recibí</div>
                        <div style={{ textAlign: "right" }}>Entregué</div>
                        <div style={{ textAlign: "right" }}>Saldo</div>
                      </div>
                      {movsDeCuenta.map((m, i) => {
                        const saldoHasta = movsDeCuenta.slice(0, i + 1).reduce((s, x) => s + efecto(x), 0);
                        return (
                          <div
                            key={m.id}
                            style={{
                              display: "grid",
                              gridTemplateColumns: "60px 1fr 120px 120px 140px 40px",
                              gap: 12,
                              padding: "12px 16px",
                              borderBottom: `1px solid ${COLORES.borde}`,
                              fontSize: 13,
                              alignItems: "center",
                            }}
                          >
                            <div style={{ color: COLORES.textoSecundario }}>{fechaCorta(m.fecha)}</div>
                            <div>{m.concepto}</div>
                            <div style={{ textAlign: "right", color: m.tipo === "recibi" ? COLORES.acentoVerde : "transparent" }}>
                              {m.tipo === "recibi" ? mxn(m.monto) : ""}
                            </div>
                            <div style={{ textAlign: "right", color: m.tipo === "entregue" ? COLORES.acentoRojo : "transparent" }}>
                              {m.tipo === "entregue" ? mxn(m.monto) : ""}
                            </div>
                            <div style={{ textAlign: "right", color: saldoHasta < 0 ? COLORES.acentoRojo : COLORES.acentoVerde, fontWeight: 600 }}>
                              {mxn(saldoHasta)}
                            </div>
                            <button
                              onClick={() => borrarMov(m.id)}
                              style={{ background: "none", border: "none", color: COLORES.borde, cursor: "pointer" }}
                            >
                              ×
                            </button>
                          </div>
                        );
                      })}
                    </>
                  )}
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    function VistaObligaciones({ data, setData, cuenta, cuentas, cuentaActiva, setCuentaActiva }) {
      const [nuevaOblig, setNuevaOblig] = useState(false);
      const [concepto, setConcepto] = useState("");
      const [monto, setMonto] = useState("");

      const obligacionesCuenta = data?.obligaciones?.filter((o) => o.cuentaId === cuentaActiva) ?? [];
      const totalObligaciones = obligacionesCuenta.reduce((s, o) => s + o.monto, 0);

      const agregarOblig = () => {
        const n = parseFloat(String(monto).replace(/[^0-9.]/g, ""));
        if (!n || !concepto.trim() || !cuenta) return;
        setData((d) => ({
          ...d,
          obligaciones: [...(d.obligaciones || []), { id: uid(), cuentaId: cuenta.id, concepto: concepto.trim(), monto: n, creado: Date.now() }],
        }));
        setConcepto("");
        setMonto("");
        setNuevaOblig(false);
      };

      const borrarOblig = (id) => {
        setData((d) => ({ ...d, obligaciones: (d.obligaciones || []).filter((o) => o.id !== id) }));
      };

      const editarOblig = (id, nuevoMonto) => {
        setData((d) => ({
          ...d,
          obligaciones: (d.obligaciones || []).map((o) => (o.id === id ? { ...o, monto: nuevoMonto } : o)),
        }));
      };

      const inp = {
        background: COLORES.fondoCard,
        border: `1px solid ${COLORES.borde}`,
        padding: "10px 12px",
        fontSize: 13,
        color: COLORES.texto,
        borderRadius: 6,
        outline: "none",
      };

      return (
        <div style={{ display: "flex", gap: 24 }}>
          <aside style={{ width: 280, flexShrink: 0 }}>
            <h3 style={{ fontSize: 12, fontWeight: 600, color: COLORES.textoSecundario, marginBottom: 12, textTransform: "uppercase" }}>Cuentas</h3>
            {cuentas?.map((c) => {
              const oblig = data?.obligaciones?.filter((o) => o.cuentaId === c.id) ?? [];
              const total = oblig.reduce((s, o) => s + o.monto, 0);
              return (
                <button
                  key={c.id}
                  onClick={() => setCuentaActiva(c.id)}
                  style={{
                    width: "100%",
                    textAlign: "left",
                    padding: "12px 14px",
                    background: c.id === cuentaActiva ? COLORES.fondoCard : "transparent",
                    border: `1px solid ${c.id === cuentaActiva ? COLORES.acento : "transparent"}`,
                    borderRadius: 8,
                    marginBottom: 6,
                    cursor: "pointer",
                  }}
                >
                  <div style={{ fontSize: 14, fontWeight: c.id === cuentaActiva ? 600 : 400 }}>{c.nombre}</div>
                  <div style={{ fontSize: 11, color: total > 0 ? COLORES.acentoRojo : COLORES.textoSecundario, marginTop: 4, fontWeight: 600 }}>
                    {total > 0 ? mxn(total) : "—"}
                  </div>
                </button>
              );
            })}
          </aside>

          <div style={{ flex: 1 }}>
            {!cuenta ? (
              <p>Selecciona una cuenta</p>
            ) : (
              <>
                <h2 style={{ fontSize: 28, fontWeight: 700, marginBottom: 8 }}>Obligaciones — {cuenta.nombre}</h2>
                <p style={{ fontSize: 14, color: COLORES.textoSecundario, marginBottom: 24 }}>
                  Total: <span style={{ color: COLORES.acentoRojo, fontWeight: 600 }}>{mxn(totalObligaciones)}</span>
                </p>

                {nuevaOblig ? (
                  <div style={{ background: COLORES.fondoCard, border: `1px solid ${COLORES.borde}`, borderRadius: 12, padding: 16, marginBottom: 24 }}>
                    <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
                      <input
                        placeholder="Concepto"
                        value={concepto}
                        onChange={(e) => setConcepto(e.target.value)}
                        style={{ background: COLORES.fondoCard, border: `1px solid ${COLORES.borde}`, padding: "10px 12px", fontSize: 13, color: COLORES.texto, borderRadius: 6, flex: 1 }}
                      />
                      <input
                        placeholder="Monto"
                        value={monto}
                        onChange={(e) => setMonto(e.target.value)}
                        style={{ background: COLORES.fondoCard, border: `1px solid ${COLORES.borde}`, padding: "10px 12px", fontSize: 13, color: COLORES.texto, borderRadius: 6, width: 120 }}
                      />
                    </div>
                    <div style={{ display: "flex", gap: 8 }}>
                      <button
                        onClick={agregarOblig}
                        style={{ background: COLORES.acento, color: COLORES.fondo, padding: "8px 16px", borderRadius: 6, cursor: "pointer", border: "none", fontWeight: 600 }}
                      >
                        Agregar
                      </button>
                      <button onClick={() => setNuevaOblig(false)} style={{ background: "transparent", color: COLORES.textoSecundario, cursor: "pointer", border: "none" }}>
                        Cancelar
                      </button>
                    </div>
                  </div>
                ) : (
                  <button
                    onClick={() => setNuevaOblig(true)}
                    style={{ fontSize: 13, color: COLORES.acento, marginBottom: 24, cursor: "pointer", border: "none", background: "none" }}
                  >
                    + Nueva obligación
                  </button>
                )}

                <div style={{ background: COLORES.fondoCard, border: `1px solid ${COLORES.borde}`, borderRadius: 12, overflow: "hidden" }}>
                  {obligacionesCuenta.length === 0 ? (
                    <p style={{ padding: 20, color: COLORES.textoSecundario, textAlign: "center" }}>Sin obligaciones</p>
                  ) : (
                    obligacionesCuenta.map((o) => (
                      <div key={o.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 16px", borderBottom: `1px solid ${COLORES.borde}` }}>
                        <div style={{ fontSize: 14 }}>{o.concepto}</div>
                        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                          <input
                            type="number"
                            value={o.monto}
                            onChange={(e) => editarOblig(o.id, parseFloat(e.target.value) || 0)}
                            style={{
                              background: COLORES.fondoCard,
                              border: `1px solid ${COLORES.borde}`,
                              padding: "10px 12px",
                              fontSize: 13,
                              color: COLORES.texto,
                              borderRadius: 6,
                              width: 120,
                            }}
                          />
                          <span style={{ fontSize: 14, color: COLORES.acentoRojo, fontWeight: 600, minWidth: 100, textAlign: "right" }}>{mxn(o.monto)}</span>
                          <button onClick={() => borrarOblig(o.id)} style={{ background: "none", border: "none", color: COLORES.borde, cursor: "pointer" }}>
                            ×
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    function VistaCruces({ data, setData, cuentas }) {
      const [de, setDe] = useState(cuentas?.[5]?.id);
      const [a, setA] = useState(cuentas?.[0]?.id);
      const [monto, setMonto] = useState("");
      const [concepto, setConcepto] = useState("");

      const agregarCruce = () => {
        const n = parseFloat(String(monto).replace(/[^0-9.]/g, ""));
        if (!n || !de || !a || de === a) return;
        setData((d) => ({
          ...d,
          movimientos: [
            ...d.movimientos,
            { id: uid(), cuentaId: de, fecha: hoy(), concepto: concepto.trim() || "Cruce interno", monto: n, tipo: "entregue", medio: "cruce", creado: Date.now() },
            { id: uid(), cuentaId: a, fecha: hoy(), concepto: concepto.trim() || "Cruce interno", monto: n, tipo: "recibi", medio: "cruce", creado: Date.now() },
          ],
        }));
        setMonto("");
        setConcepto("");
      };

      const inp = {
        background: COLORES.fondoCard,
        border: `1px solid ${COLORES.borde}`,
        padding: "10px 12px",
        fontSize: 13,
        color: COLORES.texto,
        borderRadius: 6,
        outline: "none",
      };

      return (
        <div>
          <h2 style={{ fontSize: 28, fontWeight: 700, marginBottom: 8 }}>Cruces entre entidades</h2>
          <p style={{ fontSize: 14, color: COLORES.textoSecundario, marginBottom: 24 }}>Transfiere dinero entre tus propias cuentas</p>

          <div style={{ background: COLORES.fondoCard, border: `1px solid ${COLORES.borde}`, borderRadius: 12, padding: 20 }}>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
              <div>
                <label style={{ fontSize: 11, color: COLORES.textoSecundario, display: "block", marginBottom: 6 }}>De</label>
                <select value={de} onChange={(e) => setDe(e.target.value)} style={{ ...inp, width: 180 }}>
                  {cuentas?.map((c) => (
                    <option key={c.id} value={c.id}>
                      {c.nombre}
                    </option>
                  ))}
                </select>
              </div>
              <div>
                <label style={{ fontSize: 11, color: COLORES.textoSecundario, display: "block", marginBottom: 6 }}>A</label>
                <select value={a} onChange={(e) => setA(e.target.value)} style={{ ...inp, width: 180 }}>
                  {cuentas?.map((c) => (
                    <option key={c.id} value={c.id}>
                      {c.nombre}
                    </option>
                  ))}
                </select>
              </div>
              <div>
                <label style={{ fontSize: 11, color: COLORES.textoSecundario, display: "block", marginBottom: 6 }}>Monto</label>
                <input placeholder="0.00" value={monto} onChange={(e) => setMonto(e.target.value)} style={{ ...inp, width: 140 }} />
              </div>
              <div>
                <label style={{ fontSize: 11, color: COLORES.textoSecundario, display: "block", marginBottom: 6 }}>Concepto</label>
                <input placeholder="Transferencia..." value={concepto} onChange={(e) => setConcepto(e.target.value)} style={{ ...inp, width: 200 }} />
              </div>
              <button
                onClick={agregarCruce}
                style={{
                  background: COLORES.acento,
                  color: COLORES.fondo,
                  padding: "10px 20px",
                  borderRadius: 6,
                  cursor: "pointer",
                  fontWeight: 600,
                  border: "none",
                  alignSelf: "flex-end",
                }}
              >
                Registrar
              </button>
            </div>
          </div>
        </div>
      );
    }

    function VistaPendientes({ data, setData, cuentas }) {
      const [de, setDe] = useState(cuentas?.[5]?.id);
      const [a, setA] = useState(cuentas?.[0]?.id);
      const [monto, setMonto] = useState("");
      const [concepto, setConcepto] = useState("");

      const agregarPendiente = () => {
        const n = parseFloat(String(monto).replace(/[^0-9.]/g, ""));
        if (!n || !de || !a || de === a) return;
        setData((d) => ({
          ...d,
          pendientes: [...(d.pendientes || []), { id: uid(), de, a, monto: n, concepto: concepto.trim() || "Pendiente", hecho: false, creado: Date.now() }],
        }));
        setMonto("");
        setConcepto("");
      };

      const marcarHecho = (id) => {
        setData((d) => ({
          ...d,
          pendientes: (d.pendientes || []).map((p) => (p.id === id ? { ...p, hecho: !p.hecho } : p)),
        }));
      };

      const borrarPendiente = (id) => {
        setData((d) => ({ ...d, pendientes: (d.pendientes || []).filter((p) => p.id !== id) }));
      };

      const pendientesActivos = (data?.pendientes || []).filter((p) => !p.hecho);
      const pendientesHechos = (data?.pendientes || []).filter((p) => p.hecho);
      const totalPendiente = pendientesActivos.reduce((s, p) => s + p.monto, 0);

      const inp = {
        background: COLORES.fondoCard,
        border: `1px solid ${COLORES.borde}`,
        padding: "10px 12px",
        fontSize: 13,
        color: COLORES.texto,
        borderRadius: 6,
        outline: "none",
      };

      return (
        <div>
          <h2 style={{ fontSize: 28, fontWeight: 700, marginBottom: 8 }}>Pendientes de liquidar</h2>
          <p style={{ fontSize: 14, color: COLORES.textoSecundario, marginBottom: 24 }}>Lleva control de lo que tienes que transferir</p>

          <div style={{ background: COLORES.fondoCard, border: `1px solid ${COLORES.borde}`, borderRadius: 12, padding: 20, marginBottom: 24 }}>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
              <div>
                <label style={{ fontSize: 11, color: COLORES.textoSecundario, display: "block", marginBottom: 6 }}>De</label>
                <select value={de} onChange={(e) => setDe(e.target.value)} style={{ ...inp, width: 180 }}>
                  {cuentas?.map((c) => (
                    <option key={c.id} value={c.id}>
                      {c.nombre}
                    </option>
                  ))}
                </select>
              </div>
              <div>
                <label style={{ fontSize: 11, color: COLORES.textoSecundario, display: "block", marginBottom: 6 }}>A</label>
                <select value={a} onChange={(e) => setA(e.target.value)} style={{ ...inp, width: 180 }}>
                  {cuentas?.map((c) => (
                    <option key={c.id} value={c.id}>
                      {c.nombre}
                    </option>
                  ))}
                </select>
              </div>
              <div>
                <label style={{ fontSize: 11, color: COLORES.textoSecundario, display: "block", marginBottom: 6 }}>Monto</label>
                <input placeholder="0.00" value={monto} onChange={(e) => setMonto(e.target.value)} style={{ ...inp, width: 140 }} />
              </div>
              <div>
                <label style={{ fontSize: 11, color: COLORES.textoSecundario, display: "block", marginBottom: 6 }}>Concepto</label>
                <input placeholder="Transferencia, pago..." value={concepto} onChange={(e) => setConcepto(e.target.value)} style={{ ...inp, width: 200 }} />
              </div>
              <button
                onClick={agregarPendiente}
                style={{
                  background: COLORES.acento,
                  color: COLORES.fondo,
                  padding: "10px 20px",
                  borderRadius: 6,
                  cursor: "pointer",
                  fontWeight: 600,
                  border: "none",
                  alignSelf: "flex-end",
                }}
              >
                Agregar
              </button>
            </div>
          </div>

          {pendientesActivos.length > 0 && (
            <div style={{ marginBottom: 24 }}>
              <h3 style={{ fontSize: 16, fontWeight: 600, marginBottom: 12, color: COLORES.acentoRojo }}>
                Pendientes ({pendientesActivos.length}) — {mxn(totalPendiente)}
              </h3>
              <div style={{ background: COLORES.fondoCard, border: `2px solid ${COLORES.acentoRojo}`, borderRadius: 12, overflow: "hidden" }}>
                {pendientesActivos.map((p) => {
                  const deNombre = cuentas?.find((c) => c.id === p.de)?.nombre;
                  const aNombre = cuentas?.find((c) => c.id === p.a)?.nombre;
                  return (
                    <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 16px", borderBottom: `1px solid ${COLORES.borde}` }}>
                      <input type="checkbox" checked={false} onChange={() => marcarHecho(p.id)} style={{ cursor: "pointer", width: 18, height: 18 }} />
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 14, fontWeight: 600 }}>
                          {deNombre} → {aNombre}
                        </div>
                        <div style={{ fontSize: 12, color: COLORES.textoSecundario }}>{p.concepto}</div>
                      </div>
                      <span style={{ fontSize: 16, color: COLORES.acentoRojo, fontWeight: 700, minWidth: 120, textAlign: "right" }}>{mxn(p.monto)}</span>
                      <button onClick={() => borrarPendiente(p.id)} style={{ background: "none", border: "none", color: COLORES.borde, cursor: "pointer" }}>
                        ×
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {pendientesHechos.length > 0 && (
            <div>
              <h3 style={{ fontSize: 16, fontWeight: 600, marginBottom: 12, color: COLORES.acentoVerde }}>Completados ({pendientesHechos.length})</h3>
              <div style={{ background: COLORES.fondoCard, border: `1px solid ${COLORES.borde}`, borderRadius: 12, overflow: "hidden", opacity: 0.6 }}>
                {pendientesHechos.map((p) => {
                  const deNombre = cuentas?.find((c) => c.id === p.de)?.nombre;
                  const aNombre = cuentas?.find((c) => c.id === p.a)?.nombre;
                  return (
                    <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 16px", borderBottom: `1px solid ${COLORES.borde}`, textDecoration: "line-through" }}>
                      <input type="checkbox" checked={true} onChange={() => marcarHecho(p.id)} style={{ cursor: "pointer", width: 18, height: 18 }} />
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 14 }}>
                          {deNombre} → {aNombre}
                        </div>
                        <div style={{ fontSize: 12, color: COLORES.textoSecundario }}>{p.concepto}</div>
                      </div>
                      <span style={{ fontSize: 14, minWidth: 120, textAlign: "right" }}>{mxn(p.monto)}</span>
                      <button onClick={() => borrarPendiente(p.id)} style={{ background: "none", border: "none", color: COLORES.borde, cursor: "pointer" }}>
                        ×
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<FinanzasApp />);
  </script>
</body>
</html>
