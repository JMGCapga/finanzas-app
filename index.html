<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finanzas</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #0A0E27; color: white; padding: 20px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const SUPABASE_URL = "https://oqwbyvjgyvlmofxbgvar.supabase.co";
    const SUPABASE_KEY = "sb_publishable_lnovL7ZW22et_KNVw2Gj3Q_QESsrYvs";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function App() {
      const [cuentas, setCuentas] = useState([]);

      useEffect(() => {
        const load = async () => {
          const { data } = await supabase.from("cuentas").select("*");
          setCuentas(data || []);
        };
        load();
      }, []);

      return (
        <div>
          <h1>Finanzas - App Test</h1>
          <p>Cuentas: {cuentas.length}</p>
          {cuentas.map(c => (
            <div key={c.id}>
              <h2>{c.nombre}</h2>
              <p>{c.rol}</p>
            </div>
          ))}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
