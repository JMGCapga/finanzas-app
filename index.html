<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finanzas — Control de operación</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
window.storage = {
  get: async (k) => { const v = localStorage.getItem(k); return v == null ? null : { value: v }; },
  set: async (k, v) => { localStorage.setItem(k, v); return true; }
};
</script>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"><style>body{margin:0}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ─── Diseño: "vale de obra" ─ concreto + azul plano ───
const T = {
  bg: "#ECEDEA",
  card: "#FFFFFF",
  ink: "#20241F",
  gris: "#6B7066",
  linea: "#D5D7D0",
  azul: "#1F3A5F",
  azulSuave: "#E4EAF2",
  alerta: "#B5451B",
  ok: "#3A6B4A",
};

const ENTIDADES_INICIALES = [
  { id: "personal", nombre: "Personal (JM)", tipo: "mio" },
  { id: "capga", nombre: "Capga Workshop", tipo: "mio" },
  { id: "troncoso", nombre: "Materiales Troncoso", tipo: "mio" },
  { id: "cemcoyaa", nombre: "Abastecedora Cemcoyaa", tipo: "mio" },
  { id: "itzayana", nombre: "Itzayana", tipo: "mio" },
  { id: "hermano", nombre: "Hermano", tipo: "otro" },
  { id: "primo", nombre: "Primo", tipo: "otro" },
  { id: "papa", nombre: "Papá", tipo: "otro" },
];

const CUENTAS_INICIALES = [
  { id: "c1", entidad: "personal", nombre: "Tarjeta personal" },
  { id: "c2", entidad: "personal", nombre: "Efectivo JM" },
  { id: "c3", entidad: "capga", nombre: "Tarjeta Capga" },
  { id: "c4", entidad: "troncoso", nombre: "Cuenta Troncoso" },
  { id: "c5", entidad: "papa", nombre: "Tarjeta de papá" },
  { id: "c6", entidad: "cemcoyaa", nombre: "Terminal Cemcoyaa BBVA" },
  { id: "c7", entidad: "itzayana", nombre: "Terminal Itzayana Mercado Pago" },
  { id: "c8", entidad: "itzayana", nombre: "Terminal Itzayana BBVA" },
];

const fmt = (n) =>
  "$" + Number(n || 0).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const hoy = () => new Date().toISOString().slice(0, 10);

function FinanzasCruzadas() {
  const [entidades, setEntidades] = useState(ENTIDADES_INICIALES);
  const [cuentas, setCuentas] = useState(CUENTAS_INICIALES);
  const [movs, setMovs] = useState([]);
  const [pendientes, setPendientes] = useState([]);
  const [nuevoPend, setNuevoPend] = useState({ desc: "", monto: "", fecha: hoy(), entidad: "troncoso" });
  const [porCobrar, setPorCobrar] = useState([]);
  const [nuevoCobro, setNuevoCobro] = useState({ desc: "", monto: "", fecha: hoy() });
  const [tab, setTab] = useState("registrar");
  const [cargando, setCargando] = useState(true);
  const [guardado, setGuardado] = useState(null);

  const [f, setF] = useState({
    fecha: hoy(),
    desc: "",
    monto: "",
    cant: "",
    unidad: "ton",
    pu: "",
    tipo: "gasto",
    cuentaPago: "c1",
    corresponde: "personal",
  });

  const [nuevaEnt, setNuevaEnt] = useState("");
  const [nuevaCta, setNuevaCta] = useState({ nombre: "", entidad: "personal" });

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get("finanzas-datos");
        if (r && r.value) {
          const d = JSON.parse(r.value);
          // fusiona lo guardado con las iniciales (lo guardado manda, pero nada se pierde)
          const entGuardadas = d.entidades && d.entidades.length ? d.entidades : [];
          const entFusion = [...entGuardadas];
          ENTIDADES_INICIALES.forEach((e) => {
            const ya = entFusion.find((x) => x.id === e.id);
            if (!ya) entFusion.push(e);
            else ya.tipo = e.tipo; // sincroniza mía/externo con la versión actual
          });
          setEntidades(entFusion);
          const ctasGuardadas = d.cuentas && d.cuentas.length ? d.cuentas : [];
          const ctaFusion = [...ctasGuardadas];
          CUENTAS_INICIALES.forEach((c) => {
            if (!ctaFusion.find((x) => x.id === c.id || x.nombre === c.nombre)) ctaFusion.push(c);
          });
          setCuentas(ctaFusion);
          if (d.movs) setMovs(d.movs);
          if (d.pendientes) setPendientes(d.pendientes);
          if (d.porCobrar) setPorCobrar(d.porCobrar);
        }
      } catch (e) {
        /* primera vez */
      }
      setCargando(false);
    })();
  }, []);

  const persistir = async (data) => {
    try {
      await window.storage.set(
        "finanzas-datos",
        JSON.stringify({
          entidades: data.entidades || entidades,
          cuentas: data.cuentas || cuentas,
          movs: data.movs || movs,
          pendientes: data.pendientes || pendientes,
          porCobrar: data.porCobrar || porCobrar,
        })
      );
      setGuardado("Guardado ✓");
      setTimeout(() => setGuardado(null), 1500);
    } catch (e) {
      setGuardado("No se pudo guardar");
    }
  };

  const cuentaDe = (id) => cuentas.find((c) => c.id === id);
  const entDe = (id) => entidades.find((e) => e.id === id);

  const agregar = () => {
    const montoCalc = f.cant && f.pu ? Number(f.cant) * Number(f.pu) : Number(f.monto);
    if (!montoCalc || montoCalc <= 0 || !f.desc.trim()) return;
    const cta = cuentaDe(f.cuentaPago);
    const detalle = f.cant && f.pu ? " (" + f.cant + " " + f.unidad + " × " + fmt(f.pu) + ")" : "";
    const m = {
      id: Date.now().toString(),
      fecha: f.fecha,
      desc: f.desc.trim() + detalle,
      monto: montoCalc,
      cant: f.cant ? Number(f.cant) : null,
      unidad: f.unidad,
      pu: f.pu ? Number(f.pu) : null,
      tipo: f.tipo,
      pagador: cta.entidad,
      cuenta: cta.id,
      corresponde: f.corresponde,
    };
    const nuevos = [m, ...movs];
    setMovs(nuevos);
    persistir({ movs: nuevos });
    setF({ ...f, desc: "", monto: "" });
  };

  const borrar = (id) => {
    const nuevos = movs.filter((m) => m.id !== id);
    setMovs(nuevos);
    persistir({ movs: nuevos });
  };

  const addEntidad = () => {
    const n = nuevaEnt.trim();
    if (!n) return;
    const id = "e" + Date.now();
    const nuevas = [...entidades, { id, nombre: n, tipo: "otro" }];
    setEntidades(nuevas);
    persistir({ entidades: nuevas });
    setNuevaEnt("");
  };

  const addCuenta = () => {
    const n = nuevaCta.nombre.trim();
    if (!n) return;
    const nuevas = [...cuentas, { id: "c" + Date.now(), entidad: nuevaCta.entidad, nombre: n }];
    setCuentas(nuevas);
    persistir({ cuentas: nuevas });
    setNuevaCta({ ...nuevaCta, nombre: "" });
  };

  // ─── saldos cruzados: deuda[A|B] = cuánto le debe A a B ───
  const cruces = useMemo(() => {
    const deuda = {};
    const key = (a, b) => a + "|" + b;
    movs.forEach((m) => {
      if (m.pagador === m.corresponde) return;
      if (m.tipo === "gasto") {
        deuda[key(m.corresponde, m.pagador)] = (deuda[key(m.corresponde, m.pagador)] || 0) + m.monto;
      } else if (m.tipo === "transferencia") {
        deuda[key(m.pagador, m.corresponde)] = (deuda[key(m.pagador, m.corresponde)] || 0) - m.monto;
      } else if (m.tipo === "ingreso") {
        // dinero que entró a la cuenta de "pagador" pero corresponde a otro → el receptor lo debe
        deuda[key(m.pagador, m.corresponde)] = (deuda[key(m.pagador, m.corresponde)] || 0) + m.monto;
      }
    });
    const netos = [];
    const vistos = new Set();
    entidades.forEach((a) =>
      entidades.forEach((b) => {
        if (a.id === b.id) return;
        const k = [a.id, b.id].sort().join("|");
        if (vistos.has(k)) return;
        vistos.add(k);
        const ab = deuda[key(a.id, b.id)] || 0;
        const ba = deuda[key(b.id, a.id)] || 0;
        const neto = ab - ba;
        if (Math.abs(neto) > 0.005)
          netos.push(
            neto > 0
              ? { deudor: a.id, acreedor: b.id, monto: neto }
              : { deudor: b.id, acreedor: a.id, monto: -neto }
          );
      })
    );
    return netos.sort((x, y) => y.monto - x.monto);
  }, [movs, entidades]);

  const mesActual = hoy().slice(0, 7);
  const [mesVista, setMesVista] = useState(mesActual);
  const movsMes = movs.filter((m) => m.fecha.slice(0, 7) === mesVista);

  const resumen = useMemo(() => {
    const r = {};
    entidades.forEach((e) => (r[e.id] = { gasto: 0, ingreso: 0 }));
    movsMes.forEach((m) => {
      if (!r[m.corresponde]) return;
      if (m.tipo === "gasto") r[m.corresponde].gasto += m.monto;
      if (m.tipo === "ingreso") r[m.corresponde].ingreso += m.monto;
    });
    return r;
  }, [movsMes, entidades]);

  const porCuenta = useMemo(() => {
    const r = {};
    movsMes.forEach((m) => {
      if (m.tipo === "gasto") r[m.cuenta] = (r[m.cuenta] || 0) + m.monto;
    });
    return r;
  }, [movsMes]);

  const meses = useMemo(() => {
    const s = new Set(movs.map((m) => m.fecha.slice(0, 7)));
    s.add(mesActual);
    return [...s].sort().reverse();
  }, [movs]);

  if (cargando)
    return (
      <div style={{ background: T.bg, minHeight: "100vh", display: "grid", placeItems: "center", fontFamily: "system-ui" }}>
        Cargando…
      </div>
    );

  const st = {
    input: {
      width: "100%",
      padding: "10px 12px",
      border: "1px solid " + T.linea,
      borderRadius: 6,
      fontSize: 15,
      background: T.card,
      color: T.ink,
      boxSizing: "border-box",
      fontFamily: "inherit",
    },
    label: {
      fontSize: 11,
      textTransform: "uppercase",
      letterSpacing: "0.08em",
      color: T.gris,
      marginBottom: 4,
      display: "block",
      fontWeight: 600,
    },
    card: {
      background: T.card,
      border: "1px solid " + T.linea,
      borderRadius: 8,
      padding: 16,
      marginBottom: 12,
    },
    btnAzul: {
      padding: "10px 16px",
      background: T.azul,
      color: "#fff",
      border: "none",
      borderRadius: 6,
      fontSize: 14,
      fontWeight: 800,
      cursor: "pointer",
      fontFamily: "inherit",
    },
  };

  const mios = entidades.filter((e) => e.tipo === "mio");
  const otros = entidades.filter((e) => e.tipo !== "mio");

  const esMia = (id) => (entDe(id) || {}).tipo === "mio";

  const addPendiente = () => {
    if (!nuevoPend.desc.trim() || !nuevoPend.monto || Number(nuevoPend.monto) <= 0) return;
    const nuevos = [
      ...pendientes,
      { id: "p" + Date.now(), desc: nuevoPend.desc.trim(), monto: Number(nuevoPend.monto), fecha: nuevoPend.fecha, entidad: nuevoPend.entidad },
    ].sort((a, b) => a.fecha.localeCompare(b.fecha));
    setPendientes(nuevos);
    persistir({ pendientes: nuevos });
    setNuevoPend({ ...nuevoPend, desc: "", monto: "" });
  };

  const quitarPendiente = (id) => {
    const nuevos = pendientes.filter((p) => p.id !== id);
    setPendientes(nuevos);
    persistir({ pendientes: nuevos });
  };

  const totPendientes = pendientes.reduce((s, p) => s + p.monto, 0);

  const addCobro = () => {
    if (!nuevoCobro.desc.trim() || !nuevoCobro.monto || Number(nuevoCobro.monto) <= 0) return;
    const nuevos = [
      ...porCobrar,
      { id: "q" + Date.now(), desc: nuevoCobro.desc.trim(), monto: Number(nuevoCobro.monto), fecha: nuevoCobro.fecha },
    ].sort((a, b) => a.fecha.localeCompare(b.fecha));
    setPorCobrar(nuevos);
    persistir({ porCobrar: nuevos });
    setNuevoCobro({ ...nuevoCobro, desc: "", monto: "" });
  };

  const quitarCobro = (id) => {
    const nuevos = porCobrar.filter((p) => p.id !== id);
    setPorCobrar(nuevos);
    persistir({ porCobrar: nuevos });
  };

  const totPorCobrar = porCobrar.reduce((s, p) => s + p.monto, 0);
  const diasAtraso = (fecha) => Math.floor((new Date(hoy()) - new Date(fecha)) / 86400000);

  const totDebo = cruces.filter((c) => esMia(c.deudor) && !esMia(c.acreedor)).reduce((s, c) => s + c.monto, 0);
  const totMeDeben = cruces.filter((c) => !esMia(c.deudor) && esMia(c.acreedor)).reduce((s, c) => s + c.monto, 0);
  const totInterno = cruces.filter((c) => esMia(c.deudor) && esMia(c.acreedor)).reduce((s, c) => s + c.monto, 0);

  return (
    <div style={{ background: T.bg, minHeight: "100vh", fontFamily: "'Archivo', system-ui, sans-serif", color: T.ink }}>
      <style>{"button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid " + T.azul + "; outline-offset: 1px; } .mono { font-family: 'IBM Plex Mono', monospace; }"}</style>

      <header style={{ background: T.azul, color: "#fff", padding: "18px 16px 14px" }}>
        <div style={{ maxWidth: 560, margin: "0 auto" }}>
          <div style={{ fontSize: 11, letterSpacing: "0.15em", textTransform: "uppercase", opacity: 0.75 }}>
            Vale de obra · finanzas
          </div>
          <h1 style={{ margin: "2px 0 0", fontSize: 22, fontWeight: 800 }}>Cruces y saldos</h1>
        </div>
      </header>

      <nav style={{ display: "flex", maxWidth: 560, margin: "0 auto", borderBottom: "1px solid " + T.linea }}>
        {[
          ["registrar", "Registrar"],
          ["cruces", "Cruces"],
          ["resumen", "Resumen"],
          ["directorio", "Directorio"],
        ].map(([id, lbl]) => (
          <button
            key={id}
            onClick={() => setTab(id)}
            style={{
              flex: 1,
              padding: "12px 0",
              background: "none",
              border: "none",
              borderBottom: tab === id ? "3px solid " + T.azul : "3px solid transparent",
              fontWeight: tab === id ? 800 : 400,
              fontSize: 13,
              color: tab === id ? T.azul : T.gris,
              cursor: "pointer",
              fontFamily: "inherit",
            }}
          >
            {lbl}
            {id === "cruces" && cruces.length > 0 && (
              <span
                className="mono"
                style={{ marginLeft: 5, background: T.alerta, color: "#fff", borderRadius: 10, padding: "1px 6px", fontSize: 11 }}
              >
                {cruces.length}
              </span>
            )}
          </button>
        ))}
      </nav>

      <main style={{ maxWidth: 560, margin: "0 auto", padding: 16 }}>
        {guardado && <div style={{ fontSize: 12, color: T.ok, marginBottom: 8, textAlign: "right" }}>{guardado}</div>}

        {/* ─── REGISTRAR ─── */}
        {tab === "registrar" && (
          <>
            <div style={st.card}>
              <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
                {[
                  ["gasto", "Gasto / Surtido"],
                  ["ingreso", "Ingreso"],
                  ["transferencia", "Transferencia / Abono"],
                ].map(([v, lbl]) => (
                  <button
                    key={v}
                    onClick={() => setF({ ...f, tipo: v })}
                    style={{
                      flex: 1,
                      padding: "8px 4px",
                      borderRadius: 6,
                      border: "1px solid " + (f.tipo === v ? T.azul : T.linea),
                      background: f.tipo === v ? T.azulSuave : T.card,
                      color: f.tipo === v ? T.azul : T.gris,
                      fontWeight: f.tipo === v ? 700 : 400,
                      fontSize: 12,
                      cursor: "pointer",
                      fontFamily: "inherit",
                    }}
                  >
                    {lbl}
                  </button>
                ))}
              </div>

              <div style={{ display: "grid", gap: 10 }}>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  <div>
                    <label style={st.label}>Fecha</label>
                    <input type="date" value={f.fecha} onChange={(e) => setF({ ...f, fecha: e.target.value })} style={st.input} />
                  </div>
                  <div>
                    <label style={st.label}>Monto (MXN)</label>
                    <input
                      type="number"
                      inputMode="decimal"
                      placeholder="0.00"
                      value={f.monto}
                      onChange={(e) => setF({ ...f, monto: e.target.value })}
                      style={st.input}
                      className="mono"
                    />
                  </div>
                </div>

                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
                  <div>
                    <label style={st.label}>Cantidad</label>
                    <input type="number" inputMode="decimal" placeholder="opcional" value={f.cant} onChange={(e) => setF({ ...f, cant: e.target.value })} style={st.input} className="mono" />
                  </div>
                  <div>
                    <label style={st.label}>Unidad</label>
                    <select value={f.unidad} onChange={(e) => setF({ ...f, unidad: e.target.value })} style={st.input}>
                      <option value="ton">ton</option>
                      <option value="saco">saco</option>
                      <option value="m3">m³</option>
                      <option value="pza">pieza</option>
                      <option value="m2">m²</option>
                      <option value="ml">ml</option>
                    </select>
                  </div>
                  <div>
                    <label style={st.label}>Precio unit.</label>
                    <input type="number" inputMode="decimal" placeholder="opcional" value={f.pu} onChange={(e) => setF({ ...f, pu: e.target.value })} style={st.input} className="mono" />
                  </div>
                </div>
                {f.cant && f.pu && (
                  <div style={{ fontSize: 13, color: T.azul, background: T.azulSuave, borderRadius: 6, padding: "8px 10px" }}>
                    Total calculado: <strong className="mono">{fmt(Number(f.cant) * Number(f.pu))}</strong>
                  </div>
                )}

                <div>
                  <label style={st.label}>Descripción</label>
                  <input
                    placeholder="Ej. surtido de cemento a primo, abono tarjeta papá…"
                    value={f.desc}
                    onChange={(e) => setF({ ...f, desc: e.target.value })}
                    style={st.input}
                  />
                </div>

                <div>
                  <label style={st.label}>
                    {f.tipo === "ingreso" ? "Entra a la cuenta" : f.tipo === "transferencia" ? "Sale de (quién paga)" : "¿Con qué se pagó?"}
                  </label>
                  <select value={f.cuentaPago} onChange={(e) => setF({ ...f, cuentaPago: e.target.value })} style={st.input}>
                    {cuentas.map((c) => (
                      <option key={c.id} value={c.id}>
                        {c.nombre} — {(entDe(c.entidad) || {}).nombre}
                      </option>
                    ))}
                  </select>
                </div>

                {(
                  <div>
                    <label style={st.label}>
                      {f.tipo === "transferencia" ? "Llega a (quién recibe)" : f.tipo === "ingreso" ? "¿A quién corresponde el ingreso?" : "¿A quién corresponde el gasto?"}
                    </label>
                    <select value={f.corresponde} onChange={(e) => setF({ ...f, corresponde: e.target.value })} style={st.input}>
                      <optgroup label="Mis entidades">
                        {mios.map((e) => (
                          <option key={e.id} value={e.id}>{e.nombre}</option>
                        ))}
                      </optgroup>
                      <optgroup label="Personas y otros negocios">
                        {otros.map((e) => (
                          <option key={e.id} value={e.id}>{e.nombre}</option>
                        ))}
                      </optgroup>
                    </select>
                  </div>
                )}

                {f.tipo === "gasto" && cuentaDe(f.cuentaPago) && cuentaDe(f.cuentaPago).entidad !== f.corresponde && (
                  <div style={{ background: "#FBEEE7", border: "1px solid " + T.alerta, color: T.alerta, borderRadius: 6, padding: "8px 10px", fontSize: 13 }}>
                    ⚠ Cruce: {(entDe(f.corresponde) || {}).nombre} quedará debiendo a {(entDe(cuentaDe(f.cuentaPago).entidad) || {}).nombre}
                  </div>
                )}
                {f.tipo === "ingreso" && cuentaDe(f.cuentaPago) && cuentaDe(f.cuentaPago).entidad !== f.corresponde && (
                  <div style={{ background: "#FBEEE7", border: "1px solid " + T.alerta, color: T.alerta, borderRadius: 6, padding: "8px 10px", fontSize: 13 }}>
                    ⚠ Cobro cruzado: {(entDe(cuentaDe(f.cuentaPago).entidad) || {}).nombre} quedará debiendo a {(entDe(f.corresponde) || {}).nombre}
                  </div>
                )}
                {f.tipo === "transferencia" && cuentaDe(f.cuentaPago) && cuentaDe(f.cuentaPago).entidad !== f.corresponde && (
                  <div style={{ background: T.azulSuave, color: T.azul, borderRadius: 6, padding: "8px 10px", fontSize: 13 }}>
                    Esto abona a la deuda de {(entDe(cuentaDe(f.cuentaPago).entidad) || {}).nombre} con {(entDe(f.corresponde) || {}).nombre} (o crea saldo a favor).
                  </div>
                )}

                <button onClick={agregar} style={{ ...st.btnAzul, padding: "12px 0", fontSize: 15 }}>
                  Registrar movimiento
                </button>
              </div>
            </div>

            <div style={{ ...st.label, marginTop: 8 }}>Últimos movimientos</div>
            {movs.length === 0 && (
              <div style={{ ...st.card, color: T.gris, fontSize: 14 }}>Sin movimientos todavía. Registra el primero arriba.</div>
            )}
            {movs.slice(0, 15).map((m) => {
              const cruce = m.pagador !== m.corresponde;
              return (
                <div key={m.id} style={{ ...st.card, padding: 12, display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 14, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                      {m.desc}
                    </div>
                    <div style={{ fontSize: 12, color: T.gris }}>
                      {m.fecha} · {(cuentaDe(m.cuenta) || {}).nombre}
                      {" → " + ((entDe(m.corresponde) || {}).nombre || "")}
                      {cruce && m.tipo !== "transferencia" && <span style={{ color: T.alerta, fontWeight: 700 }}> · CRUCE</span>}
                    </div>
                  </div>
                  <div className="mono" style={{ fontWeight: 600, fontSize: 14, color: m.tipo === "ingreso" ? T.ok : T.ink, whiteSpace: "nowrap" }}>
                    {m.tipo === "ingreso" ? "+" : "−"}{fmt(m.monto)}
                  </div>
                  <button onClick={() => borrar(m.id)} aria-label="Borrar movimiento" style={{ background: "none", border: "none", color: T.gris, cursor: "pointer", fontSize: 16, padding: 4 }}>
                    ×
                  </button>
                </div>
              );
            })}
          </>
        )}

        {/* ─── CRUCES ─── */}
        {tab === "cruces" && (
          <>
            <div style={{ ...st.card, background: T.ink, color: "#fff", border: "none" }}>
              <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.1em", opacity: 0.7, marginBottom: 8 }}>
                El hueco real
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, textAlign: "center" }}>
                <div>
                  <div className="mono" style={{ fontSize: 17, fontWeight: 600, color: "#F0A68C" }}>{fmt(totDebo)}</div>
                  <div style={{ fontSize: 11, opacity: 0.75 }}>Debes fuera</div>
                </div>
                <div>
                  <div className="mono" style={{ fontSize: 17, fontWeight: 600, color: "#9CC7A8" }}>{fmt(totMeDeben)}</div>
                  <div style={{ fontSize: 11, opacity: 0.75 }}>Te deben</div>
                </div>
                <div>
                  <div className="mono" style={{ fontSize: 17, fontWeight: 600, color: "#A9C3E8" }}>{fmt(totInterno)}</div>
                  <div style={{ fontSize: 11, opacity: 0.75 }}>Entre tus empresas</div>
                </div>
              </div>
              <div style={{ borderTop: "1px solid rgba(255,255,255,0.2)", marginTop: 10, paddingTop: 8, display: "flex", justifyContent: "space-between", fontSize: 13 }}>
                <span style={{ opacity: 0.8 }}>+ Facturas y surtidos por delante</span>
                <span className="mono" style={{ fontWeight: 600 }}>{fmt(totPendientes)}</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginTop: 4 }}>
                <span style={{ opacity: 0.8 }}>− Por cobrar con fecha (notas, clientes)</span>
                <span className="mono" style={{ fontWeight: 600, color: "#9CC7A8" }}>{fmt(totPorCobrar)}</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, marginTop: 4 }}>
                <span style={{ fontWeight: 800 }}>Hueco total</span>
                <span className="mono" style={{ fontWeight: 600, color: "#F0A68C" }}>{fmt(totDebo + totPendientes)}</span>
              </div>
              <div style={{ fontSize: 12, opacity: 0.75, marginTop: 8, textAlign: "center" }}>
                Dinero en tus cuentas que ya está comprometido. Réstalo antes de gastar.
              </div>
            </div>
            <div style={st.label}>Saldos entre entidades y personas (neteados)</div>
            {cruces.length === 0 ? (
              <div style={{ ...st.card, color: T.ok, fontSize: 14 }}>✓ Todo en ceros. Nadie le debe a nadie.</div>
            ) : (
              cruces.map((c, i) => {
                const deudorMio = (entDe(c.deudor) || {}).tipo === "mio";
                return (
                  <div key={i} style={{ ...st.card, borderLeft: "4px solid " + (deudorMio ? T.alerta : T.ok) }}>
                    <div style={{ fontSize: 14 }}>
                      <strong>{(entDe(c.deudor) || {}).nombre}</strong> le debe a <strong>{(entDe(c.acreedor) || {}).nombre}</strong>
                    </div>
                    <div className="mono" style={{ fontSize: 24, fontWeight: 600, marginTop: 4 }}>{fmt(c.monto)}</div>
                    <div style={{ fontSize: 12, color: T.gris, marginTop: 6 }}>
                      {deudorMio
                        ? "Debes tú: para abonar, registra una transferencia hacia " + ((entDe(c.acreedor) || {}).nombre || "") + "."
                        : "Te deben (o es anticipo de cliente): cada gasto/surtido que registres a su nombre lo va descontando."}
                    </div>
                  </div>
                );
              })
            )}
            <div style={{ ...st.label, marginTop: 16 }}>Por cobrar con fecha (notas de crédito, clientes)</div>
            {porCobrar.length === 0 && (
              <div style={{ ...st.card, color: T.gris, fontSize: 14 }}>Nada anotado. Registra aquí cada nota de crédito esperada con su fecha teórica.</div>
            )}
            {porCobrar.map((p) => {
              const atraso = diasAtraso(p.fecha);
              return (
                <div key={p.id} style={{ ...st.card, padding: 12, display: "flex", alignItems: "center", gap: 10, borderLeft: "4px solid " + (atraso > 0 ? T.alerta : T.ok) }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 14, fontWeight: 600 }}>{p.desc}</div>
                    <div style={{ fontSize: 12, color: atraso > 0 ? T.alerta : T.gris, fontWeight: atraso > 0 ? 700 : 400 }}>
                      {atraso > 0 ? "ATRASADA " + atraso + (atraso === 1 ? " día" : " días") + " · debía caer " + p.fecha : "Debe caer: " + p.fecha}
                    </div>
                  </div>
                  <div className="mono" style={{ fontWeight: 600, fontSize: 14, whiteSpace: "nowrap" }}>{fmt(p.monto)}</div>
                  <button
                    onClick={() => quitarCobro(p.id)}
                    aria-label="Marcar como cobrada"
                    style={{ background: T.azulSuave, color: T.azul, border: "none", borderRadius: 6, cursor: "pointer", fontSize: 12, padding: "6px 8px", fontWeight: 700, fontFamily: "inherit" }}
                  >
                    ✓
                  </button>
                </div>
              );
            })}
            <div style={{ ...st.card, padding: 12 }}>
              <div style={{ display: "grid", gap: 8 }}>
                <input
                  placeholder="Ej. nota de crédito Cemex junio…"
                  value={nuevoCobro.desc}
                  onChange={(e) => setNuevoCobro({ ...nuevoCobro, desc: e.target.value })}
                  style={st.input}
                />
                <div style={{ display: "flex", gap: 8 }}>
                  <input
                    type="number"
                    inputMode="decimal"
                    placeholder="Monto"
                    value={nuevoCobro.monto}
                    onChange={(e) => setNuevoCobro({ ...nuevoCobro, monto: e.target.value })}
                    style={{ ...st.input, flex: 1 }}
                    className="mono"
                  />
                  <input type="date" value={nuevoCobro.fecha} onChange={(e) => setNuevoCobro({ ...nuevoCobro, fecha: e.target.value })} style={{ ...st.input, flex: 1 }} />
                  <button onClick={addCobro} style={st.btnAzul}>+</button>
                </div>
              </div>
            </div>

            <div style={{ ...st.label, marginTop: 16 }}>Facturas por pagar y material por surtir</div>
            {pendientes.length === 0 && (
              <div style={{ ...st.card, color: T.gris, fontSize: 14 }}>Sin compromisos anotados.</div>
            )}
            {pendientes.map((p) => {
              const vencida = p.fecha < hoy();
              return (
                <div key={p.id} style={{ ...st.card, padding: 12, display: "flex", alignItems: "center", gap: 10, borderLeft: "4px solid " + (vencida ? T.alerta : T.linea) }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 14, fontWeight: 600 }}>{p.desc}</div>
                    <div style={{ fontSize: 12, color: vencida ? T.alerta : T.gris }}>
                      {vencida ? "VENCIDA · " : "Límite: "}{p.fecha} · {((entDe(p.entidad) || {}).nombre || "")}
                    </div>
                  </div>
                  <div className="mono" style={{ fontWeight: 600, fontSize: 14, whiteSpace: "nowrap" }}>{fmt(p.monto)}</div>
                  <button
                    onClick={() => quitarPendiente(p.id)}
                    aria-label="Marcar como cumplida"
                    style={{ background: T.azulSuave, color: T.azul, border: "none", borderRadius: 6, cursor: "pointer", fontSize: 12, padding: "6px 8px", fontWeight: 700, fontFamily: "inherit" }}
                  >
                    ✓
                  </button>
                </div>
              );
            })}
            <div style={{ ...st.card, padding: 12 }}>
              <div style={{ display: "grid", gap: 8 }}>
                <input
                  placeholder="Ej. factura proveedor, surtir varilla a primo…"
                  value={nuevoPend.desc}
                  onChange={(e) => setNuevoPend({ ...nuevoPend, desc: e.target.value })}
                  style={st.input}
                />
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                  <input
                    type="number"
                    inputMode="decimal"
                    placeholder="Monto"
                    value={nuevoPend.monto}
                    onChange={(e) => setNuevoPend({ ...nuevoPend, monto: e.target.value })}
                    style={st.input}
                    className="mono"
                  />
                  <input type="date" value={nuevoPend.fecha} onChange={(e) => setNuevoPend({ ...nuevoPend, fecha: e.target.value })} style={st.input} />
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <select value={nuevoPend.entidad} onChange={(e) => setNuevoPend({ ...nuevoPend, entidad: e.target.value })} style={{ ...st.input, flex: 1 }}>
                    {entidades.map((e) => (
                      <option key={e.id} value={e.id}>{e.nombre}</option>
                    ))}
                  </select>
                  <button onClick={addPendiente} style={st.btnAzul}>+ Anotar</button>
                </div>
                <div style={{ fontSize: 12, color: T.gris }}>
                  Al cumplirla, márcala con ✓ y registra el movimiento real en la pestaña Registrar.
                </div>
              </div>
            </div>
            <div style={{ ...st.card, background: T.azulSuave, border: "none", fontSize: 13, color: T.azul }}>
              Anticipo de cliente = transferencia que él te hace → aparece como que tú le debes (en material o dinero). Cada surtido que registres como gasto "a su nombre" descuenta ese saldo. Los abonos parciales a tarjetas prestadas funcionan igual: transferencia hacia esa persona.
            </div>
          </>
        )}

        {/* ─── RESUMEN ─── */}
        {tab === "resumen" && (
          <>
            <div style={{ marginBottom: 12 }}>
              <label style={st.label}>Mes</label>
              <select value={mesVista} onChange={(e) => setMesVista(e.target.value)} style={st.input}>
                {meses.map((m) => (
                  <option key={m} value={m}>{m}</option>
                ))}
              </select>
            </div>

            <div style={st.label}>Por entidad</div>
            {mios.map((e) => (
              <div key={e.id} style={{ ...st.card, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ fontWeight: 600, fontSize: 14 }}>{e.nombre}</div>
                <div style={{ textAlign: "right" }}>
                  <div className="mono" style={{ fontSize: 13, color: T.ok }}>+{fmt((resumen[e.id] || {}).ingreso)}</div>
                  <div className="mono" style={{ fontSize: 13, color: T.alerta }}>−{fmt((resumen[e.id] || {}).gasto)}</div>
                </div>
              </div>
            ))}

            <div style={{ ...st.label, marginTop: 16 }}>Gasto por tarjeta / cuenta</div>
            {cuentas.map((c) => (
              <div key={c.id} style={{ ...st.card, padding: 12, display: "flex", justifyContent: "space-between" }}>
                <div style={{ fontSize: 14 }}>
                  {c.nombre}
                  <span style={{ color: T.gris, fontSize: 12 }}> · {((entDe(c.entidad) || {}).nombre || "")}</span>
                </div>
                <div className="mono" style={{ fontWeight: 600, fontSize: 14 }}>{fmt(porCuenta[c.id])}</div>
              </div>
            ))}
          </>
        )}

        {/* ─── DIRECTORIO ─── */}
        {tab === "directorio" && (
          <>
            <div style={st.label}>Personas y negocios</div>
            <div style={st.card}>
              {entidades.map((e) => (
                <div key={e.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid " + T.linea, fontSize: 14 }}>
                  <span>{e.nombre}</span>
                  <span style={{ color: T.gris, fontSize: 12 }}>{e.tipo === "mio" ? "mía" : "externo"}</span>
                </div>
              ))}
              <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                <input
                  placeholder="Nueva persona o negocio"
                  value={nuevaEnt}
                  onChange={(e) => setNuevaEnt(e.target.value)}
                  style={{ ...st.input, flex: 1 }}
                />
                <button onClick={addEntidad} style={st.btnAzul}>+</button>
              </div>
            </div>

            <div style={{ ...st.label, marginTop: 16 }}>Cuentas y tarjetas</div>
            <div style={st.card}>
              {cuentas.map((c) => (
                <div key={c.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid " + T.linea, fontSize: 14 }}>
                  <span>{c.nombre}</span>
                  <span style={{ color: T.gris, fontSize: 12 }}>{((entDe(c.entidad) || {}).nombre || "")}</span>
                </div>
              ))}
              <div style={{ display: "grid", gap: 8, marginTop: 12 }}>
                <input
                  placeholder="Nueva cuenta o tarjeta"
                  value={nuevaCta.nombre}
                  onChange={(e) => setNuevaCta({ ...nuevaCta, nombre: e.target.value })}
                  style={st.input}
                />
                <div style={{ display: "flex", gap: 8 }}>
                  <select
                    value={nuevaCta.entidad}
                    onChange={(e) => setNuevaCta({ ...nuevaCta, entidad: e.target.value })}
                    style={{ ...st.input, flex: 1 }}
                  >
                    {entidades.map((e) => (
                      <option key={e.id} value={e.id}>{e.nombre}</option>
                    ))}
                  </select>
                  <button onClick={addCuenta} style={st.btnAzul}>+</button>
                </div>
              </div>
            </div>
          </>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(FinanzasCruzadas));
</script></body></html>
